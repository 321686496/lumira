<!DOCTYPE html>
<html lang="zh-CN" data-theme="warm">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>解锁模板 · 如画 Lumira</title>
  <link rel="stylesheet" href="../css/lumira.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;600;700&family=Noto+Sans+SC:wght@300;400;500;700&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>
<body>
  <div class="lumira-container">
    <!-- Navbar -->
    <nav class="lumira-nav">
      <div class="lumira-nav-left">
        <button class="lumira-nav-btn" onclick="history.back()"><i class="ph ph-x"></i></button>
      </div>
      <div class="lumira-nav-title">解锁模板</div>
      <div class="lumira-nav-right"></div>
    </nav>

    <!-- Content -->
    <div style="padding: 24px 24px 0;">
      <!-- Template Preview Card -->
      <div class="lumira-card fade-up" style="overflow: hidden; padding: 0;">
        <div style="position: relative;">
          <img class="lumira-card-img" src="https://picsum.photos/seed/1499327/800/600" alt="日系胶片" style="aspect-ratio: 16/9; border-radius: 12px 12px 0 0;">
          <div style="position: absolute; top: 8px; right: 8px;" class="lumira-lock-badge"><i class="ph ph-lock"></i></div>
        </div>
        <div style="padding: 20px;">
          <h2 style="font-family: 'Noto Serif SC', serif; font-size: 20px; font-weight: 600; margin-bottom: 4px;"><i class="ph ph-star"></i> 日系胶片 · 精选模�?/h2>
          <p style="font-size: 13px; color: var(--text-tertiary);">包含 12 级胶片颗�?· 暖调偏移 · 柔光晕影</p>
          <div style="display: flex; gap: 8px; margin-top: 12px;">
            <span class="lumira-tag lumira-tag-gold">胶片</span>
            <span class="lumira-tag lumira-tag-green">日系</span>
            <span class="lumira-tag" style="background: var(--bg-surface); color: var(--text-secondary);">人像</span>
          </div>
        </div>
      </div>

      <!-- Unlock Subtitle -->
      <div style="text-align: center; padding: 32px 0 20px;" class="fade-up fade-up-d1">
        <h3 style="font-family: 'Noto Serif SC', serif; font-size: 17px; font-weight: 600;">解锁方式任选其一</h3>
        <p style="font-size: 12px; color: var(--text-tertiary); margin-top: 4px;">完成任意一项即可永久解�?/p>
      </div>

      <!-- Unlock Options -->
      <div style="display: flex; flex-direction: column; gap: 12px;">
        <!-- Option 1: Watch Ad -->
        <div class="lumira-card fade-up fade-up-d1" style="padding: 16px;">
          <div style="display: flex; align-items: center; justify-content: space-between;">
            <div style="display: flex; align-items: center; gap: 12px;">
              <div class="lumira-list-icon"><i class="ph ph-monitor-play"></i></div>
              <div>
                <div class="lumira-list-title" style="font-size: 14px;">看广告解锁（30秒）</div>
                <div class="lumira-list-desc">观看一段短视频广告即可解锁</div>
              </div>
            </div>
            <button class="lumira-btn-brand" style="width: auto; padding: 8px 16px; font-size: 13px;">立即观看</button>
          </div>
        </div>

        <!-- Option 2: Share to Friends -->
        <div class="lumira-card fade-up fade-up-d2" style="padding: 16px;">
          <div style="display: flex; align-items: center; gap: 12px; margin-bottom: 12px;">
            <div class="lumira-list-icon"><i class="ph ph-paper-plane-tilt"></i></div>
            <div class="lumira-list-text">
              <div class="lumira-list-title" style="font-size: 14px;">分享给好友（2/3�?/div>
              <div class="lumira-list-desc">累计分享 3 位好友即可解�?/div>
            </div>
          </div>
          <div class="lumira-progress" style="margin-bottom: 12px;">
            <div class="lumira-progress-fill" style="width: 67%;"></div>
          </div>
          <button class="lumira-btn-outline" style="font-size: 13px; padding: 10px 24px;">继续分享</button>
        </div>

        <!-- Option 3: Take Photos -->
        <div class="lumira-card fade-up fade-up-d3" style="padding: 16px;">
          <div style="display: flex; align-items: center; gap: 12px; margin-bottom: 12px;">
            <div class="lumira-list-icon"><i class="ph ph-target"></i></div>
            <div class="lumira-list-text">
              <div class="lumira-list-title" style="font-size: 14px;">拍摄 5 张照片（3/5�?/div>
              <div class="lumira-list-desc">完成 5 张拍摄任务即可解�?/div>
            </div>
          </div>
          <div class="lumira-progress" style="margin-bottom: 12px;">
            <div class="lumira-progress-fill" style="width: 60%;"></div>
          </div>
          <button class="lumira-btn-outline" style="font-size: 13px; padding: 10px 24px;">去拍�?/button>
        </div>

        <!-- Option 4: Redemption Code -->
        <div class="lumira-card fade-up fade-up-d4" style="padding: 16px;">
          <div style="display: flex; align-items: center; justify-content: space-between;">
            <div style="display: flex; align-items: center; gap: 12px;">
              <div class="lumira-list-icon"><i class="ph ph-key"></i></div>
              <div>
                <div class="lumira-list-title" style="font-size: 14px;">输入兑换�?/div>
                <div class="lumira-list-desc">使用兑换码直接解锁模�?/div>
              </div>
            </div>
            <button class="lumira-btn-outline" style="width: auto; padding: 8px 20px; font-size: 13px;">输入</button>
          </div>
        </div>

        <!-- Option 5: Direct Purchase -->
        <div class="lumira-card fade-up fade-up-d5" style="padding: 16px; border-color: var(--brand-primary);">
          <div style="display: flex; align-items: center; justify-content: space-between;">
            <div style="display: flex; align-items: center; gap: 12px;">
              <div class="lumira-list-icon" style="background: var(--tag-gold-bg);"><i class="ph ph-diamond"></i></div>
              <div>
                <div class="lumira-list-title" style="font-size: 14px; font-weight: 600;">¥3.00 直接购买</div>
                <div class="lumira-list-desc">一次购买，永久使用</div>
              </div>
            </div>
            <button class="lumira-btn-brand" style="width: auto; padding: 8px 20px; font-size: 13px;">购买</button>
          </div>
        </div>
      </div>

      <!-- Bottom Note -->
      <div style="text-align: center; padding: 32px 0 24px;" class="fade-in">
        <p style="font-size: 12px; color: var(--text-tertiary); letter-spacing: 0.02em;">
          <i class="ph ph-lock-open"></i> 解锁后永久使�?
        </p>
      </div>
    </div>
  </div>


</body>
</html>
