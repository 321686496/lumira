<!DOCTYPE html>
<html lang="zh-CN" data-theme="warm">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>如画 Lumira · 模板库</title>
  <link rel="stylesheet" href="../css/lumira.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;600;700&family=Noto+Sans+SC:wght@300;400;500;700&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>
<body>
  <div class="lumira-container">
    <!-- NAVBAR -->
    <nav class="lumira-nav">
      <div class="lumira-nav-left">
        <i class="ph ph-caret-left" style="font-size: 20px; cursor: pointer;" onclick="location.href='home.html'"></i>
      </div>
      <div class="lumira-nav-title">模板库</div>
      <div class="lumira-nav-right">
        <i class="ph ph-magnifying-glass" style="font-size: 20px; cursor: pointer;"></i>
      </div>
    </nav>

    <!-- HERO HEADER -->
    <div class="fade-up" style="padding: 0 20px 24px;">
      <div style="background: linear-gradient(135deg, #FDF6EC 0%, #F5E6CC 100%); border-radius: 20px; padding: 28px 24px; position: relative; overflow: hidden;">
        <div style="position: absolute; top: -30px; right: -30px; width: 140px; height: 140px; border-radius: 50%; background: rgba(201,169,110,0.10);"></div>
        <div style="position: relative; z-index: 1;">
          <h2 style="font-family: 'Noto Serif SC', serif; font-size: 22px; font-weight: 600; color: var(--text-primary); margin-bottom: 8px; letter-spacing: -0.01em;">模板库</h2>
          <p style="font-size: 13px; color: var(--text-secondary); line-height: 1.6; letter-spacing: 0.02em;">108 个模板等你探索</p>
        </div>
      </div>
    </div>

    <!-- CATEGORY CARDS -->
    <div class="fade-up fade-up-d1" style="padding: 0 20px 24px;">
      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
        <!-- 构图 -->
        <div class="lumira-card-hover" style="background: var(--bg-card); border-radius: 14px; overflow: hidden; border: 1px solid var(--color-border); box-shadow: var(--shadow-card);">
          <div style="position: relative;">
            <img src="https://picsum.photos/seed/tpl-composition/400/600" alt="构图" style="width: 100%; aspect-ratio: 3/4; object-fit: cover; display: block;">
            <div style="position: absolute; top: 8px; left: 8px; background: rgba(255,255,255,0.9); backdrop-filter: blur(8px); border-radius: 9999px; padding: 4px 10px; display: flex; align-items: center; gap: 4px;">
              <i class="ph ph-frame-corners" style="font-size: 12px; color: var(--brand-primary);"></i>
              <span style="font-size: 12px; font-weight: 500;">构图</span>
            </div>
          </div>
          <div style="padding: 12px 14px 14px;">
            <div style="font-size: 13px; font-weight: 600; font-family: 'Noto Serif SC', serif;">构图技巧</div>
            <div style="display: flex; align-items: center; justify-content: space-between; margin-top: 6px;">
              <span class="lumira-tag lumira-tag-gold">最适合你</span>
              <span style="font-size: 11px; color: var(--text-tertiary);">12 步</span>
            </div>
          </div>
        </div>
        <!-- 后期 -->
        <div class="lumira-card-hover" style="background: var(--bg-card); border-radius: 14px; overflow: hidden; border: 1px solid var(--color-border); box-shadow: var(--shadow-card);">
          <div style="position: relative;">
            <img src="https://picsum.photos/seed/tpl-editing/400/600" alt="后期" style="width: 100%; aspect-ratio: 3/4; object-fit: cover; display: block;">
            <div style="position: absolute; top: 8px; left: 8px; background: rgba(255,255,255,0.9); backdrop-filter: blur(8px); border-radius: 9999px; padding: 4px 10px; display: flex; align-items: center; gap: 4px;">
              <i class="ph ph-magic-wand" style="font-size: 12px; color: var(--brand-primary);"></i>
              <span style="font-size: 12px; font-weight: 500;">后期</span>
            </div>
          </div>
          <div style="padding: 12px 14px 14px;">
            <div style="font-size: 13px; font-weight: 600; font-family: 'Noto Serif SC', serif;">后期调色</div>
            <div style="display: flex; align-items: center; justify-content: space-between; margin-top: 6px;">
              <span class="lumira-tag lumira-tag-gold">最适合你</span>
              <span style="font-size: 11px; color: var(--text-tertiary);">18 步</span>
            </div>
          </div>
        </div>
        <!-- 参数 -->
        <div class="lumira-card-hover" style="background: var(--bg-card); border-radius: 14px; overflow: hidden; border: 1px solid var(--color-border); box-shadow: var(--shadow-card);">
          <div style="position: relative;">
            <img src="https://picsum.photos/seed/tpl-params/400/600" alt="参数" style="width: 100%; aspect-ratio: 3/4; object-fit: cover; display: block;">
            <div style="position: absolute; top: 8px; left: 8px; background: rgba(255,255,255,0.9); backdrop-filter: blur(8px); border-radius: 9999px; padding: 4px 10px; display: flex; align-items: center; gap: 4px;">
              <i class="ph ph-aperture" style="font-size: 12px; color: var(--brand-primary);"></i>
              <span style="font-size: 12px; font-weight: 500;">参数</span>
            </div>
          </div>
          <div style="padding: 12px 14px 14px;">
            <div style="font-size: 13px; font-weight: 600; font-family: 'Noto Serif SC', serif;">相机参数</div>
            <div style="display: flex; align-items: center; justify-content: space-between; margin-top: 6px;">
              <span class="lumira-tag lumira-tag-gold">最适合你</span>
              <span style="font-size: 11px; color: var(--text-tertiary);">10 步</span>
            </div>
          </div>
        </div>
        <!-- 姿势 -->
        <div class="lumira-card-hover" style="background: var(--bg-card); border-radius: 14px; overflow: hidden; border: 1px solid var(--color-border); box-shadow: var(--shadow-card);">
          <div style="position: relative;">
            <img src="https://picsum.photos/seed/tpl-pose/400/600" alt="姿势" style="width: 100%; aspect-ratio: 3/4; object-fit: cover; display: block;">
            <div style="position: absolute; top: 8px; left: 8px; background: rgba(255,255,255,0.9); backdrop-filter: blur(8px); border-radius: 9999px; padding: 4px 10px; display: flex; align-items: center; gap: 4px;">
              <i class="ph ph-person" style="font-size: 12px; color: var(--brand-primary);"></i>
              <span style="font-size: 12px; font-weight: 500;">姿势</span>
            </div>
          </div>
          <div style="padding: 12px 14px 14px;">
            <div style="font-size: 13px; font-weight: 600; font-family: 'Noto Serif SC', serif;">咖啡馆半身</div>
            <div style="display: flex; align-items: center; justify-content: space-between; margin-top: 6px;">
              <span class="lumira-tag lumira-tag-gold">最适合你</span>
              <span style="font-size: 11px; color: var(--text-tertiary);">15 步</span>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- MORE TEMPLATES GRID -->
    <div class="fade-up fade-up-d2" style="margin-bottom: 24px;">
      <div class="lumira-section-title" style="padding: 0 20px;">
        <div style="display: flex; align-items: center; gap: 8px;">
          <h3>更多模板</h3>
        </div>
        <button class="lumira-section-link">筛选</button>
      </div>
      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 0 20px;">
        <!-- Template: 构图 20步 -->
        <div class="lumira-card-hover" style="background: var(--bg-card); border-radius: 14px; overflow: hidden; border: 1px solid var(--color-border); box-shadow: var(--shadow-card);">
          <div style="position: relative;">
            <img src="https://picsum.photos/seed/tpl-grid-1/400/600" alt="构图" style="width: 100%; aspect-ratio: 3/4; object-fit: cover; display: block;">
            <div style="position: absolute; top: 8px; left: 8px; background: rgba(255,255,255,0.9); backdrop-filter: blur(8px); border-radius: 9999px; padding: 4px 10px; display: flex; align-items: center; gap: 4px;">
              <i class="ph ph-frame-corners" style="font-size: 12px; color: var(--brand-primary);"></i>
              <span style="font-size: 12px; font-weight: 500;">构图</span>
            </div>
          </div>
          <div style="padding: 12px 14px 14px;">
            <div style="font-size: 13px; font-weight: 600; font-family: 'Noto Serif SC', serif;">三分法构图</div>
            <div style="display: flex; align-items: center; justify-content: space-between; margin-top: 6px;">
              <span class="lumira-tag lumira-tag-gold">最适合你</span>
              <span style="font-size: 11px; color: var(--text-tertiary);">20 步</span>
            </div>
          </div>
        </div>
        <!-- Template: 构图 14步 -->
        <div class="lumira-card-hover" style="background: var(--bg-card); border-radius: 14px; overflow: hidden; border: 1px solid var(--color-border); box-shadow: var(--shadow-card);">
          <div style="position: relative;">
            <img src="https://picsum.photos/seed/tpl-grid-2/400/600" alt="构图" style="width: 100%; aspect-ratio: 3/4; object-fit: cover; display: block;">
            <div style="position: absolute; top: 8px; left: 8px; background: rgba(255,255,255,0.9); backdrop-filter: blur(8px); border-radius: 9999px; padding: 4px 10px; display: flex; align-items: center; gap: 4px;">
              <i class="ph ph-frame-corners" style="font-size: 12px; color: var(--brand-primary);"></i>
              <span style="font-size: 12px; font-weight: 500;">构图</span>
            </div>
          </div>
          <div style="padding: 12px 14px 14px;">
            <div style="font-size: 13px; font-weight: 600; font-family: 'Noto Serif SC', serif;">引导线构图</div>
            <div style="display: flex; align-items: center; justify-content: space-between; margin-top: 6px;">
              <span class="lumira-tag lumira-tag-gold">最适合你</span>
              <span style="font-size: 11px; color: var(--text-tertiary);">14 步</span>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- 精选模板合集 -->
    <div class="fade-up fade-up-d3" style="margin-bottom: 24px;">
      <div class="lumira-section-title" style="padding: 0 20px;">
        <div style="display: flex; align-items: center; gap: 8px;">
          <h3>精选模板合集</h3>
        </div>
        <button class="lumira-section-link">全部</button>
      </div>
      <div style="display: flex; flex-direction: column; gap: 12px; padding: 0 20px;">
        <!-- Collection 1 -->
        <div class="lumira-card-hover" style="background: var(--bg-card); border-radius: 14px; overflow: hidden; border: 1px solid var(--color-border); box-shadow: var(--shadow-card); display: flex; padding: 12px; gap: 12px; align-items: center;">
          <img src="https://picsum.photos/seed/col-1/200/200" alt="合集" style="width: 72px; height: 72px; border-radius: 10px; object-fit: cover; flex-shrink: 0;">
          <div style="flex: 1; min-width: 0;">
            <div style="font-size: 14px; font-weight: 600; font-family: 'Noto Serif SC', serif;">人像摄影全攻略</div>
            <div style="font-size: 12px; color: var(--text-tertiary); margin-top: 4px;">从构图到后期，一站式掌握</div>
            <span style="font-size: 11px; color: var(--text-tertiary); margin-top: 6px; display: block;">24 个模板</span>
          </div>
          <i class="ph ph-caret-right" style="color: var(--text-tertiary); font-size: 18px; flex-shrink: 0;"></i>
        </div>
        <!-- Collection 2 -->
        <div class="lumira-card-hover" style="background: var(--bg-card); border-radius: 14px; overflow: hidden; border: 1px solid var(--color-border); box-shadow: var(--shadow-card); display: flex; padding: 12px; gap: 12px; align-items: center;">
          <img src="https://picsum.photos/seed/col-2/200/200" alt="合集" style="width: 72px; height: 72px; border-radius: 10px; object-fit: cover; flex-shrink: 0;">
          <div style="flex: 1; min-width: 0;">
            <div style="font-size: 14px; font-weight: 600; font-family: 'Noto Serif SC', serif;">胶片质感调色</div>
            <div style="font-size: 12px; color: var(--text-tertiary); margin-top: 4px;">复古胶片色彩还原指南</div>
            <span style="font-size: 11px; color: var(--text-tertiary); margin-top: 6px; display: block;">18 个模板</span>
          </div>
          <i class="ph ph-caret-right" style="color: var(--text-tertiary); font-size: 18px; flex-shrink: 0;"></i>
        </div>
        <!-- Collection 3 -->
        <div class="lumira-card-hover" style="background: var(--bg-card); border-radius: 14px; overflow: hidden; border: 1px solid var(--color-border); box-shadow: var(--shadow-card); display: flex; padding: 12px; gap: 12px; align-items: center;">
          <img src="https://picsum.photos/seed/col-3/200/200" alt="合集" style="width: 72px; height: 72px; border-radius: 10px; object-fit: cover; flex-shrink: 0;">
          <div style="flex: 1; min-width: 0;">
            <div style="font-size: 14px; font-weight: 600; font-family: 'Noto Serif SC', serif;">街拍实战手册</div>
            <div style="font-size: 12px; color: var(--text-tertiary); margin-top: 4px;">城市光影捕捉技巧</div>
            <span style="font-size: 11px; color: var(--text-tertiary); margin-top: 6px; display: block;">32 个模板</span>
          </div>
          <i class="ph ph-caret-right" style="color: var(--text-tertiary); font-size: 18px; flex-shrink: 0;"></i>
        </div>
      </div>
    </div>

    <!-- 本周新上架 -->
    <div class="fade-up fade-up-d4" style="margin-bottom: 24px;">
      <div class="lumira-section-title" style="padding: 0 20px;">
        <div style="display: flex; align-items: center; gap: 8px;">
          <h3>本周新上架</h3>
        </div>
        <button class="lumira-section-link">全部</button>
      </div>
      <div style="display: flex; flex-direction: column; gap: 12px; padding: 0 20px;">
        <div style="display: flex; align-items: center; gap: 6px; padding: 4px 0 8px;">
          <span class="lumira-tag lumira-tag-gold">
            <i class="ph ph-sparkle"></i>
            本周新增 6 个模板
          </span>
        </div>
        <!-- New Template 1 -->
        <div class="lumira-card-hover" style="background: var(--bg-card); border-radius: 14px; overflow: hidden; border: 1px solid var(--color-border); box-shadow: var(--shadow-card); display: flex; padding: 12px; gap: 12px; align-items: center;">
          <img src="https://picsum.photos/seed/new-1/200/200" alt="新模板" style="width: 64px; height: 64px; border-radius: 10px; object-fit: cover; flex-shrink: 0;">
          <div style="flex: 1; min-width: 0;">
            <div style="display: flex; align-items: center; gap: 6px;">
              <span style="font-size: 14px; font-weight: 600; font-family: 'Noto Serif SC', serif;">夏日清新人像</span>
              <span style="font-size: 10px; color: var(--brand-primary); background: rgba(201,169,110,0.12); padding: 2px 6px; border-radius: 9999px;">NEW</span>
            </div>
            <div style="font-size: 12px; color: var(--text-tertiary); margin-top: 4px;">明亮通透的夏日风格</div>
          </div>
          <i class="ph ph-caret-right" style="color: var(--text-tertiary); font-size: 18px; flex-shrink: 0;"></i>
        </div>
        <!-- New Template 2 -->
        <div class="lumira-card-hover" style="background: var(--bg-card); border-radius: 14px; overflow: hidden; border: 1px solid var(--color-border); box-shadow: var(--shadow-card); display: flex; padding: 12px; gap: 12px; align-items: center;">
          <img src="https://picsum.photos/seed/new-2/200/200" alt="新模板" style="width: 64px; height: 64px; border-radius: 10px; object-fit: cover; flex-shrink: 0;">
          <div style="flex: 1; min-width: 0;">
            <div style="display: flex; align-items: center; gap: 6px;">
              <span style="font-size: 14px; font-weight: 600; font-family: 'Noto Serif SC', serif;">夕阳剪影</span>
              <span style="font-size: 10px; color: var(--brand-primary); background: rgba(201,169,110,0.12); padding: 2px 6px; border-radius: 9999px;">NEW</span>
            </div>
            <div style="font-size: 12px; color: var(--text-tertiary); margin-top: 4px;">黄金时刻逆光拍摄</div>
          </div>
          <i class="ph ph-caret-right" style="color: var(--text-tertiary); font-size: 18px; flex-shrink: 0;"></i>
        </div>
      </div>
    </div>

    <!-- SPACER -->
    <div style="height: 88px;"></div>

    <!-- FLOATING TABBAR -->
    <nav class="floating-tabbar">
      <button class="tabbar-item" onclick="location.href='home.html'">
        <i class="ph ph-house"></i>
        <span class="tabbar-label">首页</span>
      </button>
      <button class="tabbar-item active" onclick="location.href='templates.html'">
        <i class="ph ph-book-open"></i>
        <span class="tabbar-label">模板</span>
      </button>
      <button class="tabbar-center" onclick="location.href='capture.html'">
        <i class="ph ph-camera"></i>
      </button>
      <button class="tabbar-item" onclick="location.href='inspiration.html'">
        <i class="ph ph-sparkle"></i>
        <span class="tabbar-label">灵感</span>
      </button>
      <button class="tabbar-item" onclick="location.href='profile.html'">
        <i class="ph ph-user"></i>
        <span class="tabbar-label">我的</span>
      </button>
    </nav>
  </div>
</body>
</html>
