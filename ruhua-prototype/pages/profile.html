<!DOCTYPE html>
<html lang="zh-CN" data-theme="warm">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>我的 · 如画 Lumira</title>
  <link rel="stylesheet" href="../css/lumira.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;600;700&family=Noto+Sans+SC:wght@300;400;500;700&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap">
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>
<body>
  <div class="lumira-container">
    <!-- Navbar -->
    <nav class="lumira-nav">
      <div class="lumira-nav-left"></div>
      <div class="lumira-nav-title">我的</div>
      <div class="lumira-nav-right"></div>
    </nav>

    <div style="padding: 24px 20px;">

      <!-- Profile Header Card -->
      <div class="fade-up lumira-card-svg-bg lumira-hero-svg-bg" style="background: linear-gradient(145deg, #FFF8EE 0%, #F5EDDB 40%, #EDE3D0 100%); border-radius: 24px; padding: 32px 24px 24px; text-align: center; margin-bottom: 16px; border: 1px solid rgba(201,169,110,0.12); box-shadow: 0 4px 24px rgba(201,169,110,0.08), 0 1px 2px rgba(0,0,0,0.02); position: relative; overflow: hidden;">
        <!-- Decorative circle -->
        <div style="position: absolute; top: -40px; right: -40px; width: 120px; height: 120px; border-radius: 50%; background: rgba(201,169,110,0.06); pointer-events: none;"></div>
        <div style="position: absolute; bottom: -30px; left: -20px; width: 80px; height: 80px; border-radius: 50%; background: rgba(201,169,110,0.04); pointer-events: none;"></div>

        <!-- Avatar -->
        <div style="position: relative; display: inline-block; margin-bottom: 16px;">
          <img src="https://picsum.photos/seed/733872/200/200" alt="头像" style="width: 88px; height: 88px; border-radius: 50%; object-fit: cover; border: 3px solid #FFF; box-shadow: 0 4px 16px rgba(201,169,110,0.2);">
          <div style="position: absolute; bottom: 2px; right: 2px; width: 22px; height: 22px; border-radius: 50%; background: var(--gradient-brand); border: 2.5px solid #FFF; display: flex; align-items: center; justify-content: center;">
            <i class="ph ph-caret-up" style="color: #fff; font-size: 10px;"></i>
          </div>
        </div>

        <!-- Name -->
        <h2 style="font-family: 'Playfair Display', 'Noto Serif SC', serif; font-size: 24px; font-weight: 600; color: #3D2817; margin-bottom: 10px; letter-spacing: 0.02em;">小美</h2>

        <!-- Level Badge -->
        <span style="display: inline-flex; align-items: center; gap: 4px; padding: 5px 14px; border-radius: 9999px; background: linear-gradient(135deg, #F5EDDB 0%, #EDE0C8 100%); border: 1px solid rgba(140,115,64,0.15); font-size: 12px; font-weight: 600; color: #8C7340; letter-spacing: 0.04em; margin-bottom: 20px;">
          <i class="ph ph-medal" style="font-size: 13px;"></i>
          Lv.12 入门学徒
        </span>

        <!-- XP Progress -->
        <div style="max-width: 260px; margin: 0 auto;">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
            <span style="font-size: 12px; color: #8C7340; font-weight: 500;">经验�?/span>
            <span style="font-size: 12px; color: #8C7340; font-family: 'Courier New', monospace; font-weight: 600;">1,280 / 2,000 XP</span>
          </div>
          <div style="width: 100%; height: 6px; border-radius: 3px; background: rgba(201,169,110,0.18); overflow: hidden;">
            <div style="width: 64%; height: 100%; background: linear-gradient(90deg, #C9A96E 0%, #D4B57A 100%); border-radius: 3px;"></div>
          </div>
          <p style="font-size: 11px; color: #B89860; margin-top: 8px; letter-spacing: 0.02em;">还差 720 XP 升级�?进阶学徒</p>
        </div>
      </div>

      <!-- Stats Bento -->
      <div class="lumira-card lumira-card-svg-bg fade-up fade-up-d1" style="margin-bottom: 16px; padding: 0; overflow: hidden;">
        <div style="display: grid; grid-template-columns: repeat(3, 1fr); text-align: center;">
          <div style="padding: 22px 8px; position: relative;">
            <span style="font-family: 'Playfair Display', 'Noto Serif SC', serif; font-size: 26px; font-weight: 600; color: var(--text-primary); line-height: 1; display: block;">128</span>
            <p style="font-size: 12px; color: var(--text-tertiary); margin-top: 6px; letter-spacing: 0.04em;">拍摄作品</p>
            <div style="position: absolute; right: 0; top: 24px; bottom: 24px; width: 1px; background: var(--color-border);"></div>
          </div>
          <div style="padding: 22px 8px; position: relative;">
            <span style="font-family: 'Playfair Display', 'Noto Serif SC', serif; font-size: 26px; font-weight: 600; color: var(--text-primary); line-height: 1; display: block;">36</span>
            <p style="font-size: 12px; color: var(--text-tertiary); margin-top: 6px; letter-spacing: 0.04em;">使用模板</p>
            <div style="position: absolute; right: 0; top: 24px; bottom: 24px; width: 1px; background: var(--color-border);"></div>
          </div>
          <div style="padding: 22px 8px;">
            <span style="font-family: 'Playfair Display', 'Noto Serif SC', serif; font-size: 26px; font-weight: 600; color: var(--text-primary); line-height: 1; display: block;">12</span>
            <p style="font-size: 12px; color: var(--text-tertiary); margin-top: 6px; letter-spacing: 0.04em;">收藏</p>
          </div>
        </div>
      </div>

      <!-- Fragment Collection -->
      <div class="lumira-card lumira-card-svg-bg fade-up fade-up-d2" style="margin-bottom: 16px;">
        <div class="lumira-section-title">
          <h3 style="display: flex; align-items: center; gap: 6px;">
            <i class="ph ph-puzzle-piece" style="font-size: 16px; color: var(--brand-primary);"></i>
            碎片收集
          </h3>
          <span style="font-size: 12px; color: var(--text-tertiary);">3/20 已集</span>
        </div>
        <div style="display: flex; flex-direction: column; gap: 16px;">
          <!-- 人像 -->
          <div>
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
              <div style="display: flex; align-items: center; gap: 8px;">
                <div style="width: 28px; height: 28px; border-radius: 8px; background: rgba(201,169,110,0.1); display: flex; align-items: center; justify-content: center;">
                  <i class="ph ph-user" style="font-size: 14px; color: var(--brand-primary);"></i>
                </div>
                <span style="font-size: 13px; color: var(--text-secondary); font-weight: 500;">人像</span>
              </div>
              <span style="font-size: 12px; font-family: 'Courier New', monospace; color: var(--text-tertiary); font-weight: 600;">3/5</span>
            </div>
            <div class="lumira-progress">
              <div class="lumira-progress-fill" style="width: 60%;"></div>
            </div>
          </div>
          <!-- 风光 -->
          <div>
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
              <div style="display: flex; align-items: center; gap: 8px;">
                <div style="width: 28px; height: 28px; border-radius: 8px; background: rgba(201,169,110,0.1); display: flex; align-items: center; justify-content: center;">
                  <i class="ph ph-mountain" style="font-size: 14px; color: var(--brand-primary);"></i>
                </div>
                <span style="font-size: 13px; color: var(--text-secondary); font-weight: 500;">风光</span>
              </div>
              <span style="font-size: 12px; font-family: 'Courier New', monospace; color: var(--text-tertiary); font-weight: 600;">2/5</span>
            </div>
            <div class="lumira-progress">
              <div class="lumira-progress-fill" style="width: 40%;"></div>
            </div>
          </div>
          <!-- 美食 -->
          <div>
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
              <div style="display: flex; align-items: center; gap: 8px;">
                <div style="width: 28px; height: 28px; border-radius: 8px; background: rgba(201,169,110,0.1); display: flex; align-items: center; justify-content: center;">
                  <i class="ph ph-fork-knife" style="font-size: 14px; color: var(--brand-primary);"></i>
                </div>
                <span style="font-size: 13px; color: var(--text-secondary); font-weight: 500;">美食</span>
              </div>
              <span style="font-size: 12px; font-family: 'Courier New', monospace; color: var(--text-tertiary); font-weight: 600;">4/5</span>
            </div>
            <div class="lumira-progress">
              <div class="lumira-progress-fill" style="width: 80%;"></div>
            </div>
          </div>
          <!-- 街拍 -->
          <div>
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
              <div style="display: flex; align-items: center; gap: 8px;">
                <div style="width: 28px; height: 28px; border-radius: 8px; background: rgba(201,169,110,0.1); display: flex; align-items: center; justify-content: center;">
                  <i class="ph ph-camera" style="font-size: 14px; color: var(--brand-primary);"></i>
                </div>
                <span style="font-size: 13px; color: var(--text-secondary); font-weight: 500;">街拍</span>
              </div>
              <span style="font-size: 12px; font-family: 'Courier New', monospace; color: var(--text-tertiary); font-weight: 600;">1/5</span>
            </div>
            <div class="lumira-progress">
              <div class="lumira-progress-fill" style="width: 20%;"></div>
            </div>
          </div>
        </div>
      </div>

      <!-- Quick Actions -->
      <div class="fade-up fade-up-d3" style="display: flex; gap: 8px; margin-bottom: 16px;">
        <button class="lumira-btn-ghost" onclick="location.href='growth.html'" style="flex: 1; justify-content: center;">
          <i class="ph ph-trophy"></i>
          <span>成长中心</span>
        </button>
        <button class="lumira-btn-ghost" onclick="location.href='invite.html'" style="flex: 1; justify-content: center;">
          <i class="ph ph-gift"></i>
          <span>邀请有�?/span>
        </button>
        <button class="lumira-btn-ghost" onclick="location.href='academy.html'" style="flex: 1; justify-content: center;">
          <i class="ph ph-book-open"></i>
          <span>摄影美学�?/span>
        </button>
      </div>

      <!-- Menu List -->
      <div class="lumira-card lumira-card-svg-bg fade-up fade-up-d4" style="padding: 8px 16px;">
        <div class="lumira-list">
          <!-- 我的相册 -->
          <button class="lumira-list-item">
            <div class="lumira-list-icon">
              <i class="ph ph-image"></i>
            </div>
            <div class="lumira-list-text">
              <span class="lumira-list-title">我的相册</span>
            </div>
            <span class="lumira-list-arrow"><i class="ph ph-caret-right"></i></span>
          </button>
          <!-- 我的模板 -->
          <button class="lumira-list-item">
            <div class="lumira-list-icon">
              <i class="ph ph-book-open"></i>
            </div>
            <div class="lumira-list-text">
              <span class="lumira-list-title">我的模板</span>
            </div>
            <span class="lumira-list-arrow"><i class="ph ph-caret-right"></i></span>
          </button>
          <!-- 场景管理 -->
          <button class="lumira-list-item">
            <div class="lumira-list-icon">
              <i class="ph ph-map-trifold"></i>
            </div>
            <div class="lumira-list-text">
              <span class="lumira-list-title">场景管理</span>
            </div>
            <span class="lumira-list-arrow"><i class="ph ph-caret-right"></i></span>
          </button>
          <!-- 导入模板 -->
          <button class="lumira-list-item">
            <div class="lumira-list-icon">
              <i class="ph ph-download-simple"></i>
            </div>
            <div class="lumira-list-text">
              <span class="lumira-list-title">导入模板</span>
            </div>
            <span class="lumira-list-arrow"><i class="ph ph-caret-right"></i></span>
          </button>
          <!-- 设置 -->
          <button class="lumira-list-item" onclick="location.href='settings.html'">
            <div class="lumira-list-icon">
              <i class="ph ph-gear"></i>
            </div>
            <div class="lumira-list-text">
              <span class="lumira-list-title">设置</span>
            </div>
            <span class="lumira-list-arrow"><i class="ph ph-caret-right"></i></span>
          </button>
          <!-- 关于如画 -->
          <button class="lumira-list-item">
            <div class="lumira-list-icon">
              <i class="ph ph-info"></i>
            </div>
            <div class="lumira-list-text">
              <span class="lumira-list-title">关于如画</span>
              </div>
            <span class="lumira-list-arrow"><i class="ph ph-caret-right"></i></span>
          </button>
        </div>
      </div>

    </div>

    <!-- Floating Tabbar -->
    <nav class="floating-tabbar">
      <button class="tabbar-item" onclick="location.href='home.html'">
        <i class="ph ph-house"></i>
        <span class="tabbar-label">首页</span>
      </button>
      <button class="tabbar-item" onclick="location.href='templates.html'">
        <i class="ph ph-book-open"></i>
        <span class="tabbar-label">模板</span>
      </button>
      <button class="tabbar-center" onclick="location.href='capture.html'">
        <i class="ph ph-camera"></i>
      </button>
      <button class="tabbar-item" onclick="location.href='inspiration.html'">
        <i class="ph ph-sparkle"></i>
        <span class="tabbar-label">灵感</span>
      </button>
      <button class="tabbar-item active" onclick="location.href='profile.html'">
        <i class="ph ph-user"></i>
        <span class="tabbar-label">我的</span>
      </button>
    </nav>
  </div>
</body>
</html>
