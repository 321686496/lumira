<!DOCTYPE html>
<html lang="zh-CN" data-theme="warm">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>灵感 · 如画 Lumira</title>
  <link rel="stylesheet" href="../css/lumira.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;600;700&family=Noto+Sans+SC:wght@300;400;500;700&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>
<body>
  <div class="lumira-container">
    <!-- Navbar -->
    <nav class="lumira-nav">
      <div class="lumira-nav-left"></div>
      <div class="lumira-nav-title">灵感</div>
      <div class="lumira-nav-right"></div>
    </nav>

    <div style="padding: 20px 24px;">

      <!-- Today's Mood Card -->
      <div class="lumira-card fade-up" style="margin-bottom: 20px; background: linear-gradient(135deg, #FDF6EC 0%, #F8EDD8 100%); border-color: transparent;">
        <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 16px;">
          <i class="ph ph-sun-horizon" style="color: var(--brand-primary); font-size: 20px;"></i>
          <span style="font-family: 'Noto Serif SC', serif; font-size: 16px; font-weight: 600;">今日心情</span>
        </div>
        <div class="lumira-pill-row" style="flex-wrap: wrap; gap: 8px; overflow: visible;">
          <span class="lumira-pill" style="background: #FFF5E6; border-color: #FFE4B8; color: #B8860B;">
            <i class="ph ph-smiley"></i> 开心
            <span style="opacity: 0.5; font-size: 11px; margin-left: 2px;">12</span>
          </span>
          <span class="lumira-pill" style="background: #F0E6FF; border-color: #D4B8FF; color: #7B5EA7;">
            <i class="ph ph-heart"></i> 甜酷
            <span style="opacity: 0.5; font-size: 11px; margin-left: 2px;">8</span>
          </span>
          <span class="lumira-pill" style="background: #FFF0F0; border-color: #FFD0D0; color: #C47C7C;">
            <i class="ph ph-flower"></i> 温柔
            <span style="opacity: 0.5; font-size: 11px; margin-left: 2px;">15</span>
          </span>
          <span class="lumira-pill" style="background: #F5E6D0; border-color: #D4B896; color: #8B6B3D;">
            <i class="ph ph-film-strip"></i> 复古
            <span style="opacity: 0.5; font-size: 11px; margin-left: 2px;">6</span>
          </span>
          <span class="lumira-pill" style="background: #E8F5E4; border-color: #B8D4A8; color: #5A7A48;">
            <i class="ph ph-leaf"></i> 清新
            <span style="opacity: 0.5; font-size: 11px; margin-left: 2px;">9</span>
          </span>
          <span class="lumira-pill" style="background: #EDE8E0; border-color: #C8BFB0; color: #6B5E4E;">
            <i class="ph ph-book-open"></i> 文艺
            <span style="opacity: 0.5; font-size: 11px; margin-left: 2px;">4</span>
          </span>
          <span class="lumira-pill" style="background: #FFF0E0; border-color: #FFD8B0; color: #C4783C;">
            <i class="ph ph-teddy-bear"></i> 治愈
            <span style="opacity: 0.5; font-size: 11px; margin-left: 2px;">7</span>
          </span>
        </div>
      </div>

      <!-- Outfit Diary Card -->
      <div class="lumira-card fade-up fade-up-d1" style="margin-bottom: 20px;">
        <div class="lumira-section-title">
          <div style="display: flex; align-items: center; gap: 8px;">
            <i class="ph ph-t-shirt" style="color: var(--brand-primary); font-size: 18px;"></i>
            <h3>穿搭日记</h3>
          </div>
          <button class="lumira-section-link">
            查看日记 <i class="ph ph-caret-right"></i>
          </button>
        </div>
        <div style="display: flex; align-items: center; gap: 12px; margin-bottom: 16px;">
          <div style="display: flex; align-items: baseline; gap: 4px;">
            <span class="lumira-stat-num" style="color: var(--brand-primary);">7</span>
            <span style="font-size: 13px; color: var(--text-secondary);">天</span>
          </div>
          <span style="font-size: 13px; color: var(--text-secondary);">连续打卡</span>
          <span class="lumira-tag lumira-tag-gold" style="margin-left: auto;">
            <i class="ph ph-fire"></i> 连续打卡
          </span>
        </div>
        <div style="display: flex; gap: 10px;">
          <div style="flex: 1; position: relative;">
            <img src="https://picsum.photos/seed/1926769/400/533" alt="穿搭记录" class="lumira-card-img" style="width: 100%; aspect-ratio: 3/4; object-fit: cover; border-radius: 10px;">
            <span style="position: absolute; bottom: 8px; left: 8px; font-size: 11px; color: #fff; background: rgba(0,0,0,0.4); padding: 2px 8px; border-radius: 9999px; backdrop-filter: blur(4px);">7月8日</span>
          </div>
          <div style="flex: 1; position: relative;">
            <img src="https://picsum.photos/seed/1926769/400/533" alt="穿搭记录" class="lumira-card-img" style="width: 100%; aspect-ratio: 3/4; object-fit: cover; border-radius: 10px;">
            <span style="position: absolute; bottom: 8px; left: 8px; font-size: 11px; color: #fff; background: rgba(0,0,0,0.4); padding: 2px 8px; border-radius: 9999px; backdrop-filter: blur(4px);">7月7日</span>
          </div>
        </div>
      </div>

      <!-- Recommended Scenes -->
      <div class="lumira-card fade-up fade-up-d2" style="margin-bottom: 20px;">
        <div class="lumira-section-title">
          <div>
            <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 4px;">
              <i class="ph ph-compass" style="color: var(--brand-primary); font-size: 18px;"></i>
              <h3>根据你的喜好推荐</h3>
            </div>
            <p style="font-size: 12px; color: var(--text-tertiary);">基于你最近 30 天的拍摄记录</p>
          </div>
        </div>
        <div class="lumira-grid" style="margin-top: 16px;">
          <!-- Cafe -->
          <div class="lumira-card-hover" style="cursor: pointer;">
            <div style="position: relative;">
              <img src="https://picsum.photos/seed/2074130/400/533" alt="咖啡馆" class="lumira-card-img" style="width: 100%; aspect-ratio: 3/4; object-fit: cover; border-radius: 10px;">
              <div style="position: absolute; top: 8px; left: 8px; background: rgba(255,255,255,0.9); backdrop-filter: blur(8px); border-radius: 9999px; padding: 4px 10px; display: flex; align-items: center; gap: 4px;">
                <i class="ph ph-coffee" style="font-size: 12px; color: var(--brand-primary);"></i>
                <span style="font-size: 12px; font-weight: 500;">咖啡馆</span>
              </div>
            </div>
            <div style="text-align: center; margin-top: 10px;">
              <span class="lumira-tag lumira-tag-gold">你最常去</span>
            </div>
          </div>
          <!-- Street -->
          <div class="lumira-card-hover" style="cursor: pointer;">
            <div style="position: relative;">
              <img src="https://picsum.photos/seed/1926769/400/533" alt="街拍" class="lumira-card-img" style="width: 100%; aspect-ratio: 3/4; object-fit: cover; border-radius: 10px;">
              <div style="position: absolute; top: 8px; left: 8px; background: rgba(255,255,255,0.9); backdrop-filter: blur(8px); border-radius: 9999px; padding: 4px 10px; display: flex; align-items: center; gap: 4px;">
                <i class="ph ph-buildings" style="font-size: 12px; color: var(--brand-primary);"></i>
                <span style="font-size: 12px; font-weight: 500;">街拍</span>
              </div>
            </div>
            <div style="text-align: center; margin-top: 10px;">
              <span class="lumira-tag lumira-tag-gold">31张照片</span>
            </div>
          </div>
          <!-- Shop -->
          <div class="lumira-card-hover" style="cursor: pointer;">
            <div style="position: relative;">
              <img src="https://picsum.photos/seed/1640777/400/533" alt="探店" class="lumira-card-img" style="width: 100%; aspect-ratio: 3/4; object-fit: cover; border-radius: 10px;">
              <div style="position: absolute; top: 8px; left: 8px; background: rgba(255,255,255,0.9); backdrop-filter: blur(8px); border-radius: 9999px; padding: 4px 10px; display: flex; align-items: center; gap: 4px;">
                <i class="ph ph-shopping-bag" style="font-size: 12px; color: var(--brand-primary);"></i>
                <span style="font-size: 12px; font-weight: 500;">探店</span>
              </div>
            </div>
            <div style="text-align: center; margin-top: 10px;">
              <span class="lumira-tag lumira-tag-red">新场景推荐</span>
            </div>
          </div>
          <!-- Home -->
          <div class="lumira-card-hover" style="cursor: pointer;">
            <div style="position: relative;">
              <img src="https://picsum.photos/seed/1571460/400/533" alt="居家" class="lumira-card-img" style="width: 100%; aspect-ratio: 3/4; object-fit: cover; border-radius: 10px;">
              <div style="position: absolute; top: 8px; left: 8px; background: rgba(255,255,255,0.9); backdrop-filter: blur(8px); border-radius: 9999px; padding: 4px 10px; display: flex; align-items: center; gap: 4px;">
                <i class="ph ph-house-line" style="font-size: 12px; color: var(--brand-primary);"></i>
                <span style="font-size: 12px; font-weight: 500;">居家</span>
              </div>
            </div>
            <div style="text-align: center; margin-top: 10px;">
              <span class="lumira-tag lumira-tag-green">适合今天天气</span>
            </div>
          </div>
        </div>
        <div style="text-align: center; margin-top: 20px;">
          <a href="#" style="font-size: 13px; color: var(--brand-primary); text-decoration: none; display: inline-flex; align-items: center; gap: 4px;">
            发现更多场景 <i class="ph ph-arrow-right"></i>
          </a>
        </div>
      </div>

      <!-- Check-in Section -->
      <div class="lumira-card fade-up fade-up-d3" style="margin-bottom: 20px;">
        <div class="lumira-section-title">
          <div style="display: flex; align-items: center; gap: 8px;">
            <i class="ph ph-map-pin" style="color: var(--brand-primary); font-size: 18px;"></i>
            <h3>探店打卡</h3>
          </div>
        </div>
        <div style="display: flex; align-items: baseline; gap: 6px; margin-bottom: 16px;">
          <span class="lumira-stat-num" style="font-size: 24px;">23</span>
          <span style="font-size: 13px; color: var(--text-secondary);">个探店足迹</span>
        </div>
        <div class="lumira-list">
          <div class="lumira-list-item">
            <div class="lumira-list-icon" style="background: #FFF5E6;">
              <i class="ph ph-coffee" style="color: #B8860B;"></i>
            </div>
            <div class="lumira-list-text">
              <div class="lumira-list-title">Manner Coffee 武康路店</div>
              <div class="lumira-list-desc">2天前</div>
            </div>
            <i class="ph ph-caret-right lumira-list-arrow"></i>
          </div>
          <div class="lumira-list-item">
            <div class="lumira-list-icon" style="background: #FFF0F0;">
              <i class="ph ph-flower" style="color: #C47C7C;"></i>
            </div>
            <div class="lumira-list-text">
              <div class="lumira-list-title">野兽派花园</div>
              <div class="lumira-list-desc">5天前</div>
            </div>
            <i class="ph ph-caret-right lumira-list-arrow"></i>
          </div>
          <div class="lumira-list-item">
            <div class="lumira-list-icon" style="background: #EDE8E0;">
              <i class="ph ph-building-columns" style="color: #6B5E4E;"></i>
            </div>
            <div class="lumira-list-text">
              <div class="lumira-list-title">上海当代艺术博物馆</div>
              <div class="lumira-list-desc">1周前</div>
            </div>
            <i class="ph ph-caret-right lumira-list-arrow"></i>
          </div>
        </div>
      </div>

      <!-- Load More -->
      <div class="fade-up fade-up-d4" style="text-align: center; padding: 8px 0 16px;">
        <button class="lumira-btn-ghost" style="margin: 0 auto;">
          <i class="ph ph-sparkle"></i> 加载更多灵感
        </button>
      </div>

    </div>

    <!-- Floating Tabbar -->
    <nav class="floating-tabbar">
      <button class="tabbar-item" onclick="location.href='home.html'">
        <i class="ph ph-house"></i>
        <span class="tabbar-label">首页</span>
      </button>
      <button class="tabbar-item" onclick="location.href='templates.html'">
        <i class="ph ph-book-open"></i>
        <span class="tabbar-label">模板</span>
      </button>
      <button class="tabbar-center" onclick="location.href='capture.html'">
        <i class="ph ph-camera"></i>
      </button>
      <button class="tabbar-item active" onclick="location.href='inspiration.html'">
        <i class="ph ph-sparkle"></i>
        <span class="tabbar-label">灵感</span>
      </button>
      <button class="tabbar-item" onclick="location.href='profile.html'">
        <i class="ph ph-user"></i>
        <span class="tabbar-label">我的</span>
      </button>
    </nav>
  </div>
</body>
</html>
