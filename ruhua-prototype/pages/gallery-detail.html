<!DOCTYPE html>
<html lang="zh-CN" data-theme="warm">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>后期编辑 · 如画 Lumira</title>
  <link rel="stylesheet" href="../css/lumira.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;600;700&family=Noto+Sans+SC:wght@300;400;500;700&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>
<body style="background: #1C1A17;">
  <div class="capture-container" style="max-width: 430px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; background: #1C1A17;">

    <!-- Dark Top Bar -->
    <div class="lumira-nav" style="background: rgba(28,26,23,0.92); border-bottom: 1px solid rgba(255,255,255,0.06);">
      <div class="lumira-nav-left">
        <button class="lumira-nav-btn" style="color: #fff;" onclick="location.href='gallery.html'">�?/button>
      </div>
      <div class="lumira-nav-title" style="color: #fff;">照片详情</div>
      <div class="lumira-nav-right">
        <button class="lumira-nav-btn" style="color: #C9A96E; font-size: 13px; font-weight: 500;">对比</button>
        <button class="lumira-nav-btn" style="color: rgba(255,255,255,0.6);">�?/button>
      </div>
    </div>

    <!-- Main Image Canvas Area -->
    <div style="flex: 1; display: flex; align-items: center; justify-content: center; padding: 16px; min-height: 0;">
      <img src="https://picsum.photos/seed/2074130/400/600" alt="editing photo" style="max-width: 100%; max-height: 100%; border-radius: 12px; object-fit: contain;">
    </div>

    <!-- Tool Tab Row (Horizontal Scroll Pills) -->
    <div class="lumira-pill-row" style="padding: 0 24px 12px;">
      <button class="lumira-pill active" style="color: #1C1A17;">调色</button>
      <button class="lumira-pill" style="color: rgba(255,255,255,0.7); background: transparent; border-color: rgba(255,255,255,0.2);">LUT</button>
      <button class="lumira-pill" style="color: rgba(255,255,255,0.7); background: transparent; border-color: rgba(255,255,255,0.2);">裁剪</button>
      <button class="lumira-pill" style="color: rgba(255,255,255,0.7); background: transparent; border-color: rgba(255,255,255,0.2);">磨皮</button>
      <button class="lumira-pill" style="color: rgba(255,255,255,0.7); background: transparent; border-color: rgba(255,255,255,0.2);">锐化</button>
    </div>

    <!-- Parameter Sliders -->
    <div style="padding: 0 24px 12px;">
      <div class="lumira-slider-row">
        <span class="lumira-slider-label" style="color: rgba(255,255,255,0.6);">亮度</span>
        <input type="range" class="lumira-slider" value="62" min="0" max="100" style="background: rgba(255,255,255,0.15);">
        <span class="lumira-slider-value">+12</span>
      </div>
      <div class="lumira-slider-row">
        <span class="lumira-slider-label" style="color: rgba(255,255,255,0.6);">对比�?/span>
        <input type="range" class="lumira-slider" value="44" min="0" max="100" style="background: rgba(255,255,255,0.15);">
        <span class="lumira-slider-value">-4</span>
      </div>
      <div class="lumira-slider-row">
        <span class="lumira-slider-label" style="color: rgba(255,255,255,0.6);">饱和�?/span>
        <input type="range" class="lumira-slider" value="50" min="0" max="100" style="background: rgba(255,255,255,0.15);">
        <span class="lumira-slider-value">0</span>
      </div>
      <div class="lumira-slider-row">
        <span class="lumira-slider-label" style="color: rgba(255,255,255,0.6);">色温</span>
        <input type="range" class="lumira-slider" value="58" min="0" max="100" style="background: rgba(255,255,255,0.15);">
        <span class="lumira-slider-value">+8</span>
      </div>
    </div>

    <!-- LUT Filter Thumbnails Row -->
    <div style="padding: 0 24px 16px;">
      <div style="display: flex; gap: 10px; overflow-x: auto; padding-bottom: 4px;">
        <div style="flex-shrink: 0; width: 52px; height: 52px; border-radius: 8px; overflow: hidden; border: 2px solid #C9A96E; position: relative;">
          <img src="https://picsum.photos/seed/733872/400/400" style="width: 100%; height: 100%; object-fit: cover;" alt="">
          <div style="position: absolute; bottom: 0; left: 0; right: 0; background: rgba(0,0,0,0.6); color: #fff; font-size: 8px; text-align: center; padding: 1px 0;">暖调</div>
        </div>
        <div style="flex-shrink: 0; width: 52px; height: 52px; border-radius: 8px; overflow: hidden; border: 1.5px solid rgba(255,255,255,0.2);">
          <img src="https://picsum.photos/seed/1239291/400/400" style="width: 100%; height: 100%; object-fit: cover;" alt="">
          <div style="position: absolute; bottom: 0; left: 0; right: 0; background: rgba(0,0,0,0.6); color: #fff; font-size: 8px; text-align: center; padding: 1px 0;">冷调</div>
        </div>
        <div style="flex-shrink: 0; width: 52px; height: 52px; border-radius: 8px; overflow: hidden; border: 1.5px solid rgba(255,255,255,0.2);">
          <img src="https://picsum.photos/seed/1926769/400/400" style="width: 100%; height: 100%; object-fit: cover;" alt="">
        </div>
        <div style="flex-shrink: 0; width: 52px; height: 52px; border-radius: 8px; overflow: hidden; border: 1.5px solid rgba(255,255,255,0.2);">
          <img src="https://picsum.photos/seed/774909/400/400" style="width: 100%; height: 100%; object-fit: cover;" alt="">
        </div>
        <div style="flex-shrink: 0; width: 52px; height: 52px; border-radius: 8px; overflow: hidden; border: 1.5px solid rgba(255,255,255,0.2);">
          <img src="https://picsum.photos/seed/1038002/400/400" style="width: 100%; height: 100%; object-fit: cover;" alt="">
        </div>
        <div style="flex-shrink: 0; width: 52px; height: 52px; border-radius: 8px; overflow: hidden; border: 1.5px solid rgba(255,255,255,0.2);">
          <img src="https://picsum.photos/seed/51383/400/400" style="width: 100%; height: 100%; object-fit: cover;" alt="">
        </div>
      </div>
    </div>

    <!-- EXIF Card Quick Button -->
    <div style="padding: 0 24px 12px; text-align: center;">
      <button class="lumira-btn-ghost" style="background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.12); color: rgba(255,255,255,0.7);">
        <i class="ph ph-clipboard-text"></i> 生成 EXIF 卡片
      </button>
    </div>

    <!-- Bottom Action Bar -->
    <div style="padding: 16px 24px calc(env(safe-area-inset-bottom, 0px) + 16px); display: flex; gap: 12px;">
      <button class="lumira-btn-outline" style="color: rgba(255,255,255,0.7); border-color: rgba(255,255,255,0.2); background: transparent; flex: 1; padding: 14px 16px;">重置</button>
      <button class="lumira-btn-primary" style="flex: 1; padding: 14px 16px;">导出</button>
    </div>

  </div>
</body>
</html>
