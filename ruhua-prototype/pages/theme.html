<!DOCTYPE html>
<html lang="zh-CN" data-theme="warm">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>主题选择 · 如画 Lumira</title>
  <link rel="stylesheet" href="../css/lumira.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;600;700&family=Noto+Sans+SC:wght@300;400;500;700&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
  <div class="lumira-container">
    <!-- Navbar -->
    <nav class="lumira-nav">
      <div class="lumira-nav-left">
        <button class="lumira-nav-btn" onclick="history.back()">�?/button>
      </div>
      <div class="lumira-nav-title">主题选择</div>
      <div class="lumira-nav-right"></div>
    </nav>

    <!-- Content -->
    <div style="padding: 24px 24px 0;">
      <!-- Section Title -->
      <div class="fade-up" style="margin-bottom: 20px;">
        <h2 style="font-family: 'Noto Serif SC', serif; font-size: 22px; font-weight: 600; margin-bottom: 4px;">选择你的风格</h2>
        <p style="font-size: 13px; color: var(--text-tertiary);">主题将影响整个应用的视觉体验</p>
      </div>

      <!-- Theme Grid 2x2 -->
      <div class="lumira-grid fade-up fade-up-d1" style="--grid-columns: 2; gap: 12px;">
        <!-- Theme Card: Warm (Current) -->
        <div class="theme-card" style="border-radius: 12px; overflow: hidden; border: 2px solid var(--brand-primary); cursor: pointer; transition: transform 0.15s; background: #FAF7F2;">
          <div style="height: 100px; background: #FAF7F2; position: relative;">
            <div style="position: absolute; top: 0; left: 0; right: 0; height: 3px; background: #C9A96E;"></div>
            <div style="padding: 16px 12px;">
              <div style="width: 60%; height: 4px; background: #1A1A1A; border-radius: 2px; margin-bottom: 6px;"></div>
              <div style="width: 80%; height: 3px; background: #5C5852; border-radius: 2px; margin-bottom: 4px;"></div>
              <div style="width: 50%; height: 3px; background: #9C9690; border-radius: 2px;"></div>
            </div>
            <!-- Mini tabbar -->
            <div style="position: absolute; bottom: 8px; left: 8px; right: 8px; height: 16px; border-radius: 9999px; border: 1px solid #EAE5DC; background: rgba(255,255,255,0.8); backdrop-filter: blur(8px); display: flex; align-items: center; justify-content: space-around;">
              <div style="width: 3px; height: 3px; border-radius: 50%; background: #9C9690;"></div>
              <div style="width: 3px; height: 3px; border-radius: 50%; background: #9C9690;"></div>
              <div style="width: 6px; height: 6px; border-radius: 50%; background: #C9A96E; transform: translateY(-2px);"></div>
              <div style="width: 3px; height: 3px; border-radius: 50%; background: #9C9690;"></div>
              <div style="width: 3px; height: 3px; border-radius: 50%; background: #9C9690;"></div>
            </div>
            <!-- Checkmark -->
            <div style="position: absolute; top: 10px; right: 10px; width: 20px; height: 20px; border-radius: 50%; background: var(--brand-primary); display: flex; align-items: center; justify-content: center; font-size: 10px; color: #fff;">�?/div>
          </div>
          <div style="padding: 10px 12px 12px;">
            <div style="font-size: 13px; font-weight: 500; font-family: 'Noto Serif SC', serif;">暖米�?/div>
            <div style="font-size: 10px; color: #9C9690; margin-top: 2px;">当前主题</div>
          </div>
        </div>

        <!-- Theme Card: Ink -->
        <div class="theme-card" style="border-radius: 12px; overflow: hidden; border: 2px solid transparent; cursor: pointer; transition: transform 0.15s; background: #1C1A17;">
          <div style="height: 100px; background: #1C1A17; position: relative;">
            <div style="position: absolute; top: 0; left: 0; right: 0; height: 3px; background: #D4B57A;"></div>
            <div style="padding: 16px 12px;">
              <div style="width: 60%; height: 4px; background: #F2EEE6; border-radius: 2px; margin-bottom: 6px;"></div>
              <div style="width: 80%; height: 3px; background: #9C9690; border-radius: 2px; margin-bottom: 4px;"></div>
              <div style="width: 50%; height: 3px; background: #6B6660; border-radius: 2px;"></div>
            </div>
            <!-- Mini tabbar -->
            <div style="position: absolute; bottom: 8px; left: 8px; right: 8px; height: 16px; border-radius: 9999px; border: 1px solid #3A3530; background: rgba(38,35,32,0.85); backdrop-filter: blur(8px); display: flex; align-items: center; justify-content: space-around;">
              <div style="width: 3px; height: 3px; border-radius: 50%; background: #6B6660;"></div>
              <div style="width: 3px; height: 3px; border-radius: 50%; background: #6B6660;"></div>
              <div style="width: 6px; height: 6px; border-radius: 50%; background: #D4B57A; transform: translateY(-2px);"></div>
              <div style="width: 3px; height: 3px; border-radius: 50%; background: #6B6660;"></div>
              <div style="width: 3px; height: 3px; border-radius: 50%; background: #6B6660;"></div>
            </div>
          </div>
          <div style="padding: 10px 12px 12px;">
            <div style="font-size: 13px; font-weight: 500; font-family: 'Noto Serif SC', serif; color: #1A1A1A;">浓墨</div>
            <div style="font-size: 10px; color: #9C9690; margin-top: 2px;">深色护眼</div>
          </div>
        </div>

        <!-- Theme Card: Retro -->
        <div class="theme-card" style="border-radius: 12px; overflow: hidden; border: 2px solid transparent; cursor: pointer; transition: transform 0.15s; background: #F5E6D3;">
          <div style="height: 100px; background: #F5E6D3; position: relative;">
            <div style="position: absolute; top: 0; left: 0; right: 0; height: 3px; background: #D4865C;"></div>
            <div style="padding: 16px 12px;">
              <div style="width: 60%; height: 4px; background: #3D2817; border-radius: 2px; margin-bottom: 6px;"></div>
              <div style="width: 80%; height: 3px; background: #6B4C2F; border-radius: 2px; margin-bottom: 4px;"></div>
              <div style="width: 50%; height: 3px; background: #9C8060; border-radius: 2px;"></div>
            </div>
            <!-- Mini tabbar -->
            <div style="position: absolute; bottom: 8px; left: 8px; right: 8px; height: 16px; border-radius: 8px; border: 1px solid #E0D0B8; background: rgba(250,240,224,0.9); backdrop-filter: blur(8px); display: flex; align-items: center; justify-content: space-around;">
              <div style="width: 3px; height: 3px; border-radius: 50%; background: #9C8060;"></div>
              <div style="width: 3px; height: 3px; border-radius: 50%; background: #9C8060;"></div>
              <div style="width: 6px; height: 6px; border-radius: 50%; background: #D4865C; transform: translateY(-2px);"></div>
              <div style="width: 3px; height: 3px; border-radius: 50%; background: #9C8060;"></div>
              <div style="width: 3px; height: 3px; border-radius: 50%; background: #9C8060;"></div>
            </div>
          </div>
          <div style="padding: 10px 12px 12px; background: #fff;">
            <div style="font-size: 13px; font-weight: 500; font-family: 'Noto Serif SC', serif;">胶片复古</div>
            <div style="font-size: 10px; color: #9C9690; margin-top: 2px;">浓郁暖调</div>
          </div>
        </div>

        <!-- Theme Card: Fresh -->
        <div class="theme-card" style="border-radius: 12px; overflow: hidden; border: 2px solid transparent; cursor: pointer; transition: transform 0.15s; background: #FAF7F2;">
          <div style="height: 100px; background: #FFF5F5; position: relative;">
            <div style="position: absolute; top: 0; left: 0; right: 0; height: 3px; background: #E8B4A0;"></div>
            <div style="padding: 16px 12px;">
              <div style="width: 60%; height: 4px; background: #4A3F35; border-radius: 2px; margin-bottom: 6px;"></div>
              <div style="width: 80%; height: 3px; background: #8C7F70; border-radius: 2px; margin-bottom: 4px;"></div>
              <div style="width: 50%; height: 3px; background: #B8AEA0; border-radius: 2px;"></div>
            </div>
            <!-- Mini tabbar -->
            <div style="position: absolute; bottom: 8px; left: 8px; right: 8px; height: 14px; border-radius: 9999px; border: 1px solid transparent; background: rgba(255,255,255,0.65); display: flex; align-items: center; justify-content: space-around;">
              <div style="width: 3px; height: 3px; border-radius: 50%; background: #B8AEA0;"></div>
              <div style="width: 3px; height: 3px; border-radius: 50%; background: #B8AEA0;"></div>
              <div style="width: 6px; height: 6px; border-radius: 50%; background: #E8B4A0; transform: translateY(-2px);"></div>
              <div style="width: 3px; height: 3px; border-radius: 50%; background: #B8AEA0;"></div>
              <div style="width: 3px; height: 3px; border-radius: 50%; background: #B8AEA0;"></div>
            </div>
          </div>
          <div style="padding: 10px 12px 12px; background: #fff;">
            <div style="font-size: 13px; font-weight: 500; font-family: 'Noto Serif SC', serif;">日系清新</div>
            <div style="font-size: 10px; color: #9C9690; margin-top: 2px;">柔和粉调</div>
          </div>
        </div>
      </div>

      <!-- Description -->
      <div style="text-align: center; padding: 24px 0;" class="fade-in fade-up-d3">
        <p style="font-size: 12px; color: var(--text-tertiary); line-height: 1.8;">
          点击卡片可切换主�?br>
          主题切换即时生效，所有页面同步更�?        </p>
      </div>

      <!-- System Follow Toggle -->
      <div class="lumira-card fade-in fade-up-d4" style="padding: 16px 20px;">
        <div style="display: flex; align-items: center; justify-content: space-between;">
          <div>
            <div style="font-size: 15px; font-weight: 500;">跟随系统</div>
            <div style="font-size: 12px; color: var(--text-tertiary); margin-top: 2px;">根据系统深浅色自动切�?/div>
          </div>
          <button class="lumira-toggle" data-state="off"></button>
        </div>
      </div>

      <!-- Bottom Spacing -->
      <div style="height: 24px;"></div>
    </div>
  </div>



  <script>
    document.querySelectorAll('.theme-card').forEach(card => {
      card.addEventListener('click', function() {
        if (this.querySelector('.lumira-toggle')) return;
        document.querySelectorAll('.theme-card').forEach(c => {
          c.style.borderColor = 'transparent';
          const check = c.querySelector('div[style*="border-radius: 50%"][style*="background: var(--brand-primary)"]');
          if (check) check.remove();
        });
        this.style.borderColor = 'var(--brand-primary)';
        const header = this > div:first-child;
      });
    });
  </script>
</body>
</html>
