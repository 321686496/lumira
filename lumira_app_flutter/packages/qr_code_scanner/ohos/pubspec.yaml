name: qr_code_scanner_ohos
description: QR code scanner that can be embedded inside flutter. It uses zxing in Ohos. (HarmonyOS native platform implementation)
version: 1.0.0
publish_to: none

environment:
  sdk: '>=2.17.3 <4.0.0'
  flutter: ">=1.20.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_lints: ^2.0.1

flutter:
  plugin:
    platforms:
      ohos:
        package: com.example.qr_code_scanner_ohos
        pluginClass: QrCodeScannerOhosPlugin