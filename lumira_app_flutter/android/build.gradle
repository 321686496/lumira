buildscript {
    ext.kotlin_version = '1.8.10'
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:7.4.2'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = '../build'
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(':app')
}
// 强制所有子项目使用统一的 Kotlin 版本，避免插件内置旧版 Kotlin 导致兼容性问题
subprojects {
    // 覆盖 buildscript classpath 中的 Kotlin 插件版本（如 gpu_image 内置 1.3.50）
    project.buildscript.configurations.all {
        resolutionStrategy {
            force 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.8.10'
        }
    }
    // 覆盖运行时依赖中的 Kotlin stdlib 版本
    project.configurations.all {
        resolutionStrategy {
            force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.10'
            force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.10'
            force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.10'
            force 'org.jetbrains.kotlin:kotlin-stdlib-common:1.8.10'
        }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
