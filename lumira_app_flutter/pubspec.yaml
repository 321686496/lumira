name: lumira_app_flutter
description: 如画 Lumira - 摄影辅助应用（Flutter 版）
publish_to: 'none'
version: 1.0.0+1

environment:
  # 调整：实际环境为 Harmony 兼容 Flutter 3.7.12 / Dart 2.19.6（brief 中 >=3.0.0 <4.0.0 不兼容）
  sdk: '>=2.19.6 <3.0.0'
  flutter: '>=3.7.0'

dependencies:
  flutter:
    sdk: flutter

  # 状态管理（brief ^2.5.1 → 调整为兼容 Dart 2.19 的版本）
  flutter_riverpod: ^2.3.6

  # 路由（brief ^14.6.1 → 调整为兼容 Dart 2.19 的版本，14.x 需 Dart 3）
  go_router: ^6.5.7

  # 相机（brief ^2.5.0 → 调整为兼容 Dart 2.19 的版本，2.x 需 Dart 3）
  camerawesome: ^1.4.0

  # 权限（brief ^12.0.1 → CPF-Flutter 3.7 Harmony 适配版本 10.3.2，11+ 需 Dart 3；未回合上游，见 dependency_overrides）
  permission_handler: 10.3.2  # Harmony 3.7 适配版本 (CPF-Flutter)

  # 文件操作（brief ^10.3.8 → CPF-Flutter 3.7 Harmony 适配版本 8.0.6；未回合上游，见 dependency_overrides）
  file_picker: 8.0.6  # Harmony 3.7 适配版本 (CPF-Flutter)
  path_provider: ^2.0.14

  # 本地数据库
  sqflite: ^2.2.6

  # 图像处理
  gpu_image: ^1.0.0
  image: ^4.0.16

  # 保存相册（brief ^3.0.6 → CPF-Flutter 3.7 Harmony 适配版本 3.0.6；已回合上游，使用 pub.dev；精确锁定避免 3.0.7+ 依赖 mime 需 Dart 3.2+）
  saver_gallery: '3.0.6'  # Harmony 3.7 适配版本 (CPF-Flutter)

  # 屏幕常亮（CPF-Flutter 3.7 Harmony 适配版本 1.1.6；未回合上游，见 dependency_overrides）
  wakelock_plus: 1.1.6  # Harmony 3.7 适配版本 (CPF-Flutter)

  # 启动屏（brief ^2.4.7 → CPF-Flutter 3.7 Harmony 适配版本 2.3.13；未回合上游，见 dependency_overrides）
  flutter_native_splash: 2.3.13  # Harmony 3.7 适配版本 (CPF-Flutter)

  # 分享（brief ^12.0.1 → 调整为 ^7.2.2，7.x 兼容 Dart 2.18+，8+ 需 Dart 3.3+）
  share_plus: ^7.2.2

  # 设备信息（brief ^12.3.0 → CPF-Flutter 3.7 Harmony 适配版本 9.1.2；未回合上游，见 dependency_overrides）
  device_info_plus: 9.1.2  # Harmony 3.7 适配版本 (CPF-Flutter)

  # 工具（brief path ^1.9.0 / intl ^0.19.0 → 调整为兼容 Dart 2.19 的版本）
  path: ^1.8.2
  intl: ^0.18.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  # brief ^3.0.0 → 调整为兼容 Dart 2.19 的版本，3.x 需 Dart 3
  flutter_lints: ^2.0.1
  # brief ^1.0.3 → 调整为兼容 Dart 2.19 的版本，1.x 需 Dart 3
  mocktail: ^0.3.0
  # sqflite 测试支持（in-memory 数据库，无需真实设备）
  # brief ^2.3.0 → 调整为兼容 Dart 2.19 的版本，2.3+ 需 Dart 3
  sqflite_common_ffi: ^2.2.0+1

# Harmony 3.7 适配版本依赖覆盖
# 来源：https://gitcode.com/CPF-Flutter/docs/blob/main/ThirdpartyLibrarites.md （3.7 推荐版本列）
# 5 个依赖未回合上游，需通过 gitcode fork 拉取；saver_gallery 已回合上游，使用 pub.dev
# path / meta 提升至 fork 所需版本（flutter_test SDK 锁定 path 1.8.2 / meta 1.8.0，API 兼容）
# mime / path_provider / uuid 锁定为 Dart 2.19 兼容版本：saver_gallery 3.0.6 的 ^1.0.5 / ^2.1.3 / ^4.4.0 需 Dart 3+；
# 1.0.4 / 2.0.14 / 4.2.2 为同主版本下兼容 Dart 2.19 的最新版本，API 稳定，详见 Fix Report
dependency_overrides:
  # Task 1.1 注释说明 flutter_test SDK 锁定 path 1.8.2 / meta 1.8.0（API 兼容）
  # 但 ^1.8.3 / ^1.9.1 caret 约束会解析到 path 1.9.1 / meta 1.19.0（需 Dart 3+），
  # 在 Dart 2.19.6 上导致 flutter_test 编译失败。
  # Task 1.2 修正：改为精确版本钉定，与 SDK 锁定值一致。
  path: 1.8.2
  meta: 1.8.0
  js: ^0.6.7
  mime: '1.0.4'
  path_provider: '2.0.14'
  uuid: '4.2.2'
  permission_handler:
    git:
      url: https://gitcode.com/CPF-Flutter/flutter_permission_handler.git
      ref: master
      path: permission_handler
  file_picker:
    git:
      url: https://gitcode.com/CPF-Flutter/fluttertpc_file_picker.git
      ref: master
  device_info_plus:
    git:
      url: https://gitcode.com/CPF-Flutter/flutter_plus_plugins.git
      ref: master
      path: packages/device_info_plus/device_info_plus
  flutter_native_splash:
    git:
      url: https://gitcode.com/CPF-Flutter/fluttertpc_flutter_native_splash.git
      ref: master
  wakelock_plus:
    git:
      url: https://gitcode.com/CPF-Flutter/fluttertpc_wakelock_plus.git
      ref: master
      path: wakelock_plus

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/templates/
    - assets/images/scenes/
