name: lumira_app_flutter
description: 如画 Lumira - 摄影辅助应用（Flutter 版）
publish_to: 'none'
version: 1.0.0+1

environment:
  # 调整：实际环境为 Harmony 兼容 Flutter 3.7.12 / Dart 2.19.6（brief 中 >=3.0.0 <4.0.0 不兼容）
  sdk: '>=2.19.6 <3.0.0'
  flutter: '>=3.7.0'

dependencies:
  flutter:
    sdk: flutter

  # 状态管理（brief ^2.5.1 → 调整为兼容 Dart 2.19 的版本）
  flutter_riverpod: ^2.3.6

  # 路由（brief ^14.6.1 → 调整为兼容 Dart 2.19 的版本，14.x 需 Dart 3）
  go_router: ^6.5.7

  # 相机（brief ^2.5.0 → 调整为兼容 Dart 2.19 的版本，2.x 需 Dart 3）
  camerawesome: ^1.4.0

  # 权限（brief ^12.0.1 → 调整为兼容 Dart 2.19 的版本，11+ 需 Dart 3）
  permission_handler: ^10.2.0

  # 文件操作（brief ^10.3.8 → 调整为兼容 Dart 2.19 的版本）
  file_picker: ^5.2.6
  path_provider: ^2.0.14

  # 本地数据库
  sqflite: ^2.2.6

  # 图像处理
  gpu_image: ^1.0.0
  image: ^4.0.16

  # 保存相册（brief ^3.0.6 → 调整为 3.0.3，因 3.0.4+ 依赖 path ^1.9.0，与 flutter_test 的 path 1.8.2 冲突）
  saver_gallery: 3.0.3

  # 屏幕常亮
  wakelock_plus: ^1.1.3

  # 启动屏（brief ^2.4.7 → 调整为兼容 Dart 2.19 的版本）
  flutter_native_splash: ^2.2.19

  # 分享（brief ^12.0.1 → 调整为 ^7.2.2，7.x 兼容 Dart 2.18+，8+ 需 Dart 3.3+）
  share_plus: ^7.2.2

  # 设备信息（brief ^12.3.0 → 调整为兼容 Dart 2.19 的版本，9+ 需 Dart 3）
  device_info_plus: ^8.1.2

  # 工具（brief path ^1.9.0 / intl ^0.19.0 → 调整为兼容 Dart 2.19 的版本）
  path: ^1.8.2
  intl: ^0.18.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  # brief ^3.0.0 → 调整为兼容 Dart 2.19 的版本，3.x 需 Dart 3
  flutter_lints: ^2.0.1
  # brief ^1.0.3 → 调整为兼容 Dart 2.19 的版本，1.x 需 Dart 3
  mocktail: ^0.3.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/templates/
    - assets/images/scenes/
