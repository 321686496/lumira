<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>如画 LUMIRA · 碎片海报 V16 · 四版式对比</title>
<style>
  :root{
    --gold:#C9A96E;--gold-deep:#A9884B;--ink:#2A241C;
    --text2:#6B6257;--text3:#9C9180;
    --surface:#FDFBF7;--surface-alt:#F3EDE2;--line:rgba(201,169,110,.34);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#EFEAE0;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;padding:44px 20px 120px;-webkit-font-smoothing:antialiased}
  .serif{font-family:"Noto Serif SC","Songti SC",Georgia,serif}
  .hd{text-align:center;max-width:760px;margin:0 auto}
  .hd h1{color:#4A4236;font-size:20px;letter-spacing:3px;font-weight:600}
  .hd p{color:#8A7F6E;font-size:12px;letter-spacing:1.5px;line-height:2;margin-top:8px}
  .hd p b{color:#A08A5F;font-weight:600}

  #wrap{display:flex;flex-wrap:wrap;gap:44px;justify-content:center;align-items:flex-start;margin-top:36px}
  .branch{display:flex;flex-direction:column;align-items:center;gap:12px}
  .branch > span{font-size:10.5px;color:#A08A5F;letter-spacing:1px;border:1px solid var(--line);padding:3px 12px;border-radius:12px;background:#F3ECE0}

  /* ============ 通用海报壳 ============ */
  .poster{width:320px;aspect-ratio:3/4;position:relative;overflow:hidden;background:linear-gradient(180deg,#FDFBF7 0%,#FBF5EA 100%);border:1px solid var(--line);box-shadow:0 22px 54px -28px rgba(60,48,28,.36);border-radius:4px}
  .hairline{position:absolute;inset:8px;border:1px solid var(--line);pointer-events:none;z-index:6}
  .hairline b{position:absolute;width:13px;height:13px;border:1.5px solid var(--gold)}
  .hairline b:nth-child(1){top:-2px;left:-2px;border-right:none;border-bottom:none}
  .hairline b:nth-child(2){top:-2px;right:-2px;border-left:none;border-bottom:none}
  .hairline b:nth-child(3){bottom:-2px;left:-2px;border-right:none;border-top:none}
  .hairline b:nth-child(4){bottom:-2px;right:-2px;border-left:none;border-top:none}

  .brand{display:flex;align-items:baseline;gap:7px}
  .brand .en{font-size:10px;letter-spacing:4px;color:var(--gold-deep);font-weight:700}
  .brand .zh{font-size:9px;letter-spacing:3px;color:var(--text3)}
  .kicker{font-size:9px;letter-spacing:3px;color:var(--gold-deep)}
  .ttl{font-size:26px;font-weight:700;color:var(--ink);letter-spacing:1px;line-height:1.3}
  .sub{font-size:10px;letter-spacing:1px;color:var(--text2);line-height:1.7}
  .goldline{width:26px;height:1.5px;background:var(--gold);opacity:.9}

  .board svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;display:block}

  /* -------- L1 极简图为主 · 文字收边 -------- */
  .L1{padding:0}
  .L1 .top{position:absolute;top:0;left:0;right:0;padding:22px 30px 0;display:flex;justify-content:space-between;align-items:center;z-index:4}
  .L1 .boardbox{position:absolute;top:40px;left:0;right:0;bottom:56px;z-index:1;margin:0 26px}
  .L1 .btm{position:absolute;left:0;right:0;bottom:0;padding:12px 30px 20px;display:flex;justify-content:space-between;align-items:flex-end;z-index:4}
  .L1 .btm .ttl{font-size:11px;letter-spacing:.5px;color:var(--ink)}
  .L1 .btm .p{font-size:8.5px;letter-spacing:2px;color:var(--text3);margin-top:4px}

  /* -------- L2 三段式：头 / 中拼板 / 下进度 -------- */
  .L2{display:flex;flex-direction:column;padding:24px 30px 22px}
  .L2 .head .brand{justify-content:space-between}
  .L2 .head .kicker{margin-top:20px}
  .L2 .head .ttl{margin-top:9px}
  .L2 .head .sub{margin-top:9px}
  .L2 .boardbox{width:100%;aspect-ratio:272/209;margin-top:26px;position:relative;z-index:1;box-shadow:0 12px 26px -18px rgba(60,48,28,.42)}
  .L2 .prog{margin-top:auto;border-top:1px solid var(--line);padding-top:13px;text-align:center;position:relative;z-index:2}
  .L2 .prog .plabel{font-size:11px;letter-spacing:3px;color:var(--text2)}
  .L2 .prog .plabel b{font-family:Georgia,serif;font-size:15px;color:var(--gold-deep);padding:0 2px}
  .L2 .prog .pbar{margin:9px auto 0;display:flex;gap:5px;justify-content:center}
  .L2 .prog .pbar i{width:20px;height:3px;background:var(--line);border-radius:2px}
  .L2 .prog .pbar i.on{background:var(--gold)}
  .L2 .prog .psent{font-size:8.5px;letter-spacing:2px;color:var(--text3);margin-top:8px}

  /* -------- L3 左右分栏：左文案 / 右拼板 -------- */
  .L3{display:flex;flex-direction:row;padding:24px 0 0}
  .L3 .col-t{flex:0 0 150px;padding:2px 0 0 30px;z-index:2;display:flex;flex-direction:column}
  .L3 .col-t .kicker{margin-top:16px}
  .L3 .col-t .ttl{font-size:23px;margin-top:10px}
  .L3 .col-t .goldline{margin-top:14px}
  .L3 .col-t .sub{margin-top:12px}
  .L3 .col-t .prog{margin-top:20px}
  .L3 .col-t .plabel{font-size:10px;letter-spacing:2px;color:var(--text3)}
  .L3 .col-t .plabel b{font-family:Georgia,serif;font-size:20px;color:var(--gold-deep)}
  .L3 .col-i{flex:1;position:relative;z-index:1;min-width:0}
  .L3 .col-i .boardbox{position:absolute;top:6px;right:-6px;width:180px;height:180px;box-shadow:0 14px 28px -16px rgba(60,48,28,.45)}
  .L3 .foot{position:absolute;left:30px;right:0;bottom:18px;z-index:2;font-size:8.5px;letter-spacing:2px;color:var(--text3)}

  /* -------- L4 拼板满铺 · 字叠暗部 -------- */
  .L4{background:#0d0a08;padding:0}
  .L4 .fullsvg{position:absolute;inset:0;z-index:1}
  .L4 .fullsvg svg{width:100%;height:100%;display:block}
  .L4 .shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.10) 0%,rgba(0,0,0,.16) 40%,rgba(0,0,0,.72) 100%);z-index:2}
  .L4 .top{position:absolute;top:0;left:0;right:0;padding:22px 28px 0;display:flex;justify-content:space-between;align-items:center;z-index:4}
  .L4 .top .en{color:#E7CE9E}
  .L4 .top .zh{color:rgba(255,255,255,.66)}
  .L4 .btm{position:absolute;left:0;right:0;bottom:0;padding:0 28px 22px;z-index:4;text-align:left}
  .L4 .ttl{color:#FFF8EC;font-size:27px}
  .L4 .goldline{margin-top:14px;background:linear-gradient(90deg,var(--gold),rgba(201,169,110,0))}
  .L4 .sub{color:rgba(255,255,255,.78);margin-top:10px}
  .L4 .plabel{color:rgba(255,255,255,.85);font-size:11px;letter-spacing:3px;margin-top:18px}
  .L4 .plabel b{font-family:Georgia,serif;font-size:16px;color:#E7CE9E}
  .L4 .pbar{display:flex;gap:5px;margin-top:9px;width:70%}
  .L4 .pbar i{flex:1;height:3px;background:rgba(255,255,255,.18);border-radius:2px}
  .L4 .pbar i.on{background:var(--gold)}
</style>
</head>
<body>
  <div class="hd">
    <h1>碎片海报 V16 · 同一块「对角斜裂碎片板」× 4 种排版</h1>
    <p>都放上<b>情绪化文案 + 收集进度文案</b>（以下都显示“拼到 3/5”在途态，方便对比排版）。选喜欢的，我再定稿专做那一路。</p>
  </div>
  <div id="wrap"></div>

<script>
  const W=272,H=209,filled=3;

  /* ======= 碎片拼板（对角斜裂）生成，返回 svg 字符串；pid 保证 clipPath 唯一 ======= */
  function fragBoardSVG(pid){
    const jag=(pts,amp)=>{
      if(!amp) return pts.map(p=>({x:p.x,y:p.y}));
      const out=[{x:pts[0].x,y:pts[0].y}];let s=1;
      for(let i=0;i<pts.length-1;i++){const a=pts[i],b=pts[i+1],dx=b.x-a.x,dy=b.y-a.y,L=Math.hypot(dx,dy)||1;
        out.push({x:(a.x+b.x)/2+(-dy/L)*amp*s,y:(a.y+b.y)/2+(dx/L)*amp*s});out.push({x:b.x,y:b.y});s=-s;}
      return out;
    };
    const lT=jag([{x:0,y:0},{x:0,y:64}]),lB=jag([{x:0,y:64},{x:0,y:209}]);
    const tL=jag([{x:0,y:0},{x:88,y:0},{x:176,y:0}]),tR=jag([{x:176,y:0},{x:224,y:0},{x:272,y:0}]);
    const rA=jag([{x:272,y:0},{x:272,y:90},{x:272,y:150}]),rB=jag([{x:272,y:150},{x:272,y:209}]);
    const bL=jag([{x:0,y:209},{x:38,y:209},{x:76,y:209}]),bM=jag([{x:76,y:209},{x:142,y:209},{x:208,y:209}]),bR=jag([{x:208,y:209},{x:272,y:209}]);
    const d0=jag([{x:0,y:64},{x:50,y:76},{x:90,y:94}],2.6),d1=jag([{x:90,y:94},{x:128,y:108},{x:160,y:120}],2.6),d2=jag([{x:160,y:120},{x:188,y:127},{x:220,y:133}],2.4),d3=jag([{x:220,y:133},{x:244,y:141},{x:272,y:150}],2.6);
    const bUp=jag([{x:176,y:0},{x:170,y:58},{x:160,y:120}],2.4),bDn1=jag([{x:90,y:94},{x:84,y:150},{x:76,y:209}],2.6),bDn2=jag([{x:220,y:133},{x:214,y:170},{x:208,y:209}],2.4);
    const rev=a=>a.concat().reverse().map(p=>({x:p.x,y:p.y}));
    const join=(...ss)=>{const o=[];for(const s of ss)for(const p of s){const l=o[o.length-1];if(!l||l.x!==p.x||l.y!==p.y)o.push(p);}const l=o[o.length-1];if(l.x===o[0].x&&l.y===o[0].y)o.pop();return o;};
    const faces=[
      join(tL,bUp,rev(d1),rev(d0),rev(lT)),
      join(tR,rA,rev(d3),rev(d2),rev(bUp)),
      join(d0,bDn1,rev(bL),rev(lB)),
      join(d1,d2,bDn2,rev(bM),rev(bDn1)),
      join(d3,rB,rev(bR),rev(bDn2))
    ];
    const pathOf=pts=>pts.map((p,i)=>(i?'L':'M')+p.x+' '+p.y).join(' ')+' Z';
    const bbox=pts=>{const xs=pts.map(p=>p.x),ys=pts.map(p=>p.y);return{x:Math.min(...xs),y:Math.min(...ys),w:Math.max(...xs)-Math.min(...xs),h:Math.max(...ys)-Math.min(...ys)}};
    const cent=pts=>({x:pts.reduce((a,p)=>a+p.x,0)/pts.length,y:pts.reduce((a,p)=>a+p.y,0)/pts.length});
    const shots=['lumiA','lumiB','lumiC','lumiD','lumiE'];
    let html='';
    faces.forEach((pts,i)=>{
      const d=pathOf(pts),cid=pid+'_fr'+i;
      html+='<defs><clipPath id="'+cid+'"><path d="'+d+'"/></clipPath></defs>';
      if(i<filled){
        const bb=bbox(pts);
        html+='<image x="'+bb.x+'" y="'+bb.y+'" width="'+bb.w+'" height="'+bb.h+'" preserveAspectRatio="xMidYMid slice" clip-path="url(#'+cid+')" href="https://picsum.photos/seed/'+shots[i]+'/'+Math.round(bb.w*3)+'/'+Math.round(bb.h*3)+'"/>';
        html+='<path d="'+d+'" fill="none" stroke="rgba(201,169,110,.78)" stroke-width="1.6" stroke-linejoin="round"/>';
      }else{
        const c=cent(pts);
        html+='<path d="'+d+'" fill="rgba(246,241,232,.72)" stroke="rgba(201,169,110,.82)" stroke-width="1.5" stroke-dasharray="5 4"/>';
        html+='<text x="'+c.x+'" y="'+(c.y-4)+'" text-anchor="middle" style="font-size:9.5px;fill:#9C9180;letter-spacing:1px">+ 待拼</text>';
      }
    });
    return html;
  }

  const progBar=f=>{let h='';for(let i=0;i<5;i++)h+='<i'+(i<f?' class="on"':'')+'></i>';return h;};

  function poster(L){
    const p=document.createElement('div');
    p.className='poster '+L;
    const svgInner=('<svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" style="overflow:visible">'+fragBoardSVG(L+'_'+filled)+'</svg>');
    const brand='<div class="brand"><span class="en">LUMIRA</span><span class="zh">如画</span></div>';
    const seal='<span style="font-size:9px;font-weight:600;letter-spacing:2px;padding:3px 11px;border:1px solid var(--gold);border-radius:999px;color:var(--gold-deep)">拼碎片</span>';
    if(L==='L1'){
      p.innerHTML=
        '<span class="hairline"><b></b><b></b><b></b><b></b></span>'+
        '<div class="top">'+brand+seal+'</div>'+
        '<div class="boardbox board" style="margin:0 26px">'+svgInner+'</div>'+
        '<div class="btm"><div><div class="ttl serif">光，正一片片归位</div><div class="p">已收集 <b style="font-family:Georgia;color:var(--gold-deep)">3</b> / 5 · 集齐点亮完整一束光</div></div>'+
        '<div style="text-align:right"><div class="kicker" style="text-align:right">FRAGMENTS · 光影手记</div><div class="sub" style="text-align:right">每一次快门，都是和光的一次重逢</div></div></div>';
    }else if(L==='L2'){
      p.innerHTML=
        '<span class="hairline"><b></b><b></b><b></b><b></b></span>'+
        '<div class="head"><div style="display:flex;justify-content:space-between;align-items:center">'+brand+seal+'</div>'+
          '<div class="kicker" style="margin-top:20px">FRAGMENTS · 光影手记</div>'+
          '<div class="ttl serif" style="margin-top:9px">光，正一片片归位</div>'+
          '<div class="sub" style="margin-top:9px">第 3 缕光刚落进手心 · 还差 2 缕，一起把它凑齐。</div></div>'+
        '<div class="boardbox board">'+svgInner+'</div>'+
        '<div class="prog"><div class="plabel">已收集 <b>'+filled+'</b> / 5</div>'+
          '<div class="pbar">'+progBar(filled)+'</div>'+
          '<div class="psent">集齐 5 缕，点亮完整一束光 · 如画 LUMIRA</div></div>';
    }else if(L==='L3'){
      p.innerHTML=
        '<span class="hairline"><b></b><b></b><b></b><b></b></span>'+
        '<div style="position:absolute;top:0;left:0;right:0;padding:20px 30px 0;display:flex;justify-content:space-between;align-items:center;z-index:3">'+brand+'<span style="font-size:8.5px;letter-spacing:2px;color:var(--text3)">FRAGMENTS</span></div>'+
        '<div class="col-t">'+
          '<div class="kicker" style="margin-top:16px">光影手记</div>'+
          '<div class="ttl serif" style="font-size:23px;margin-top:10px">光，正一片片归位</div>'+
          '<div class="goldline" style="margin-top:14px"></div>'+
          '<div class="sub" style="margin-top:12px">第 3 缕光刚落进手心\n还差 2 缕，等你一起凑齐。</div>'+
          '<div class="prog" style="margin-top:22px"><div class="plabel">已收集<br><b style="font-size:26px">'+filled+'</b> <span style="color:var(--text3)">/ 5</span></div>'+
          '<div class="pbar" style="margin-top:10px">'+progBar(filled)+'</div></div>'+
        '</div>'+
        '<div class="col-i"><div class="boardbox board" style="position:absolute;top:44px;right:-6px;width:190px;height:190px">'+svgInner+'</div></div>'+
        '<div class="foot">如画 LUMIRA · 记录每一帧光影</div>';
    }else if(L==='L4'){
      p.innerHTML=
        '<div class="fullsvg"><svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" style="width:100%;height:100%;display:block;overflow:visible">'+fragBoardSVG(L+'_'+filled)+'</svg></div>'+
        '<div class="shade"></div>'+
        '<div class="top"><div class="brand"><span class="en" style="letter-spacing:4px">LUMIRA</span><span class="zh" style="letter-spacing:3px;color:rgba(255,255,255,.66)">如画</span></div>'+
          '<span style="font-size:9px;letter-spacing:2px;color:rgba(255,255,255,.8);border:1px solid rgba(231,206,158,.7);padding:3px 11px;border-radius:999px">拼碎片</span></div>'+
        '<div class="btm"><div class="ttl serif">光，正一片片归位</div>'+
          '<div class="goldline"></div>'+
          '<div class="sub">第 3 缕光刚落进手心 · 还差 2 缕，一起把它凑齐。</div>'+
          '<div class="plabel">已收集 <b>'+filled+'</b> / 5</div>'+
          '<div class="pbar">'+progBar(filled)+'</div></div>';
    }
    return p;
  }

  function branch(label,post){
    const c=document.createElement('div');c.className='branch';
    const s=document.createElement('span');s.textContent=label;c.appendChild(s);c.appendChild(post);wrap.appendChild(c);
  }
  branch('① 极简 · 图为主，文字收边', poster('L1'));
  branch('② 三段式 · 头 / 中拼板 / 下进度', poster('L2'));
  branch('③ 左右分栏 · 左文案 / 右拼板', poster('L3'));
  branch('④ 拼板满铺 · 文字叠暗部', poster('L4'));
</script>
</body>
</html>
