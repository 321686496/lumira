<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>邀请海报 · 设计方向对照</title>
<style>
  *{box-sizing:border-box; margin:0; padding:0;}
  body{background:#EAE6DD; min-height:100vh; padding:32px 20px;
    font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;}
  h1{text-align:center; font-size:18px; color:#4A443A; letter-spacing:2px; margin-bottom:6px;}
  .sub{text-align:center; font-size:12px; color:#8A8478; letter-spacing:1px; margin-bottom:26px;}
  .row{display:flex; gap:22px; justify-content:center; flex-wrap:wrap;}
  .item{background:#fff; border-radius:14px; padding:14px; box-shadow:0 18px 40px -22px rgba(80,55,35,.45);}
  .item img{display:block; width:300px; height:533px; object-fit:cover; border-radius:10px;}
  .tag{margin-top:10px; text-align:center; font-size:13px; font-weight:700; color:#4A443A; letter-spacing:1px;}
  .tag small{display:block; font-weight:400; font-size:11px; color:#8A8478; margin-top:4px;}
</style>
</head>
<body>
  <h1>邀请海报 · 高级感设计方向（9:16）</h1>
  <div class="sub">两套方向样图 · 最终文字会以真实排版还原 · 选一个方向我再渲染成 HTML + Flutter</div>
  <div class="row">
    <div class="item">
      <img src="invite_direction_01_morandi.jpg" alt="方向一" />
      <div class="tag">方向一 · 柔和莫兰迪<small>温暖粉奶油系 · 细金线分区 · 多用留白</small></div>
    </div>
    <div class="item">
      <img src="invite_direction_02_photocover.jpg" alt="方向二" />
      <div class="tag">方向二 · 摄影画册封面<small>上部暖光摄影主图 · 下部白带内容 · 杂志编辑感</small></div>
    </div>
  </div>
</body>
</html>
