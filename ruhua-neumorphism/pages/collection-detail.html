<!DOCTYPE html>
<html lang="zh-CN" data-theme="warm">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>如画 Lumira — 精选集详情</title>
  <link rel="stylesheet" href="../colors_and_type.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    html, body {
      width: 100%;
      min-height: 100vh;
      background-color: var(--color-canvas);
      color: var(--color-text-primary);
      font-family: var(--font-cn-body);
      font-size: var(--text-body);
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    body {
      padding-bottom: calc(80px + var(--safe-area-bottom));
    }

    /* --- Top Navigation Bar --- */
    .top-nav {
      position: sticky;
      top: 0;
      z-index: 50;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: var(--space-6) var(--page-padding) var(--space-4);
      background-color: var(--color-canvas);
    }

    .back-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 36px;
      height: 36px;
      border-radius: var(--radius-sm);
      background-color: var(--color-canvas);
      box-shadow: var(--shadow-convex-subtle);
      border: none;
      cursor: pointer;
      transition: box-shadow var(--transition-fast);
    }

    .back-btn:active {
      box-shadow: var(--shadow-pressed);
    }

    .back-btn i {
      font-size: 20px;
      color: var(--color-text-primary);
    }

    .nav-title {
      font-family: var(--font-cn-title);
      font-size: var(--text-h2);
      font-weight: var(--weight-semibold);
      color: var(--color-text-primary);
      letter-spacing: var(--tracking-snug);
      line-height: var(--leading-snug);
    }

    .nav-placeholder {
      width: 36px;
    }

    /* --- Cover Image (Concave) --- */
    .cover-area {
      margin: 0 var(--page-padding) var(--space-5);
      width: calc(100% - 2 * var(--page-padding));
      aspect-ratio: 16 / 9;
      background-color: var(--color-surface-alt);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-concave);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .cover-area i {
      font-size: 40px;
      color: var(--color-text-tertiary);
      opacity: 0.3;
    }

    /* --- Collection Info --- */
    .collection-info {
      display: flex;
      align-items: center;
      gap: var(--space-4);
      padding: 0 var(--page-padding);
      margin-bottom: var(--space-6);
    }

    .info-chip {
      display: inline-flex;
      align-items: center;
      gap: var(--space-1);
      font-size: var(--text-micro);
      color: var(--color-text-tertiary);
    }

    .info-chip i {
      font-size: 14px;
    }

    .info-divider {
      width: 3px;
      height: 3px;
      border-radius: var(--radius-shutter);
      background-color: var(--color-divider);
    }

    /* --- Photo Grid (3-column) --- */
    .photo-grid {
      padding: 0 var(--page-padding);
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: var(--space-3);
    }

    .photo-item {
      aspect-ratio: 1;
      background-color: var(--color-surface-alt);
      border-radius: var(--radius-sm);
      box-shadow: var(--shadow-convex-subtle);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: box-shadow var(--transition-fast);
    }

    .photo-item:active {
      box-shadow: var(--shadow-pressed);
    }

    .photo-item i {
      font-size: 18px;
      color: var(--color-text-tertiary);
      opacity: 0.3;
    }

    /* --- Bottom Action Bar --- */
    .bottom-actions {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 375px;
      padding: var(--space-4) var(--page-padding) var(--safe-area-bottom);
      background-color: var(--color-canvas);
      display: flex;
      gap: var(--space-3);
      z-index: 50;
    }

    .action-btn {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: var(--space-2);
      padding: var(--space-3) var(--space-4);
      background-color: var(--color-canvas);
      border: none;
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-convex);
      color: var(--color-text-secondary);
      font-family: var(--font-cn-body);
      font-size: var(--text-caption);
      font-weight: var(--weight-medium);
      letter-spacing: var(--tracking-wide);
      cursor: pointer;
      transition: box-shadow var(--transition-fast), transform var(--transition-fast);
    }

    .action-btn:active {
      box-shadow: var(--shadow-pressed);
      transform: scale(0.97);
    }

    .action-btn i {
      font-size: 18px;
    }
  </style>
</head>
<body>

  <!-- ==================== Top Navigation ==================== -->
  <div class="top-nav">
    <button class="back-btn" onclick="history.back()">
      <i class="ph ph-caret-left"></i>
    </button>
    <span class="nav-title">街角咖啡时光</span>
    <div class="nav-placeholder"></div>
  </div>

  <!-- ==================== Cover Image ==================== -->
  <div class="cover-area">
    <i class="ph ph-images"></i>
  </div>

  <!-- ==================== Collection Info ==================== -->
  <div class="collection-info">
    <span class="info-chip">
      <i class="ph ph-images"></i>
      12 张照片
    </span>
    <span class="info-divider"></span>
    <span class="info-chip">
      <i class="ph ph-calendar"></i>
      2026.06.15 创建
    </span>
  </div>

  <!-- ==================== Photo Grid ==================== -->
  <div class="photo-grid">

    <div class="photo-item"><i class="ph ph-image"></i></div>
    <div class="photo-item"><i class="ph ph-image"></i></div>
    <div class="photo-item"><i class="ph ph-image"></i></div>
    <div class="photo-item"><i class="ph ph-image"></i></div>
    <div class="photo-item"><i class="ph ph-image"></i></div>
    <div class="photo-item"><i class="ph ph-image"></i></div>
    <div class="photo-item"><i class="ph ph-image"></i></div>
    <div class="photo-item"><i class="ph ph-image"></i></div>
    <div class="photo-item"><i class="ph ph-image"></i></div>

  </div>

  <!-- ==================== Bottom Action Bar ==================== -->
  <div class="bottom-actions">
    <button class="action-btn">
      <i class="ph ph-pencil-simple"></i>
      编辑
    </button>
    <button class="action-btn">
      <i class="ph ph-share-network"></i>
      分享
    </button>
  </div>

</body>
</html>
