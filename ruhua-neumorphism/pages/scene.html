<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>如画 Lumira — 拍摄场景</title>
  <link rel="stylesheet" href="../colors_and_type.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html { font-size: 16px; scroll-behavior: smooth; }
    body {
      background-color: var(--color-canvas);
      font-family: var(--font-cn-body);
      font-size: var(--text-body);
      color: var(--color-text-primary);
      line-height: var(--leading-normal);
      min-height: 100vh;
      padding-bottom: calc(var(--tab-bar-height) + var(--shutter-size) / 2 + var(--safe-area-bottom) + 20px);
      overflow-x: hidden;
    }

    .section-title {
      font-family: var(--font-cn-title);
      font-size: var(--text-h2);
      font-weight: var(--weight-semibold);
      color: var(--color-text-primary);
      letter-spacing: var(--tracking-snug);
      line-height: var(--leading-snug);
    }

    .neu-card {
      background-color: var(--color-canvas);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-convex);
    }
    .neu-inset {
      background-color: var(--color-canvas);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-concave);
    }
    .neu-pill {
      background-color: var(--color-canvas);
      border-radius: var(--radius-pill);
      box-shadow: var(--shadow-convex-subtle);
      transition: box-shadow var(--transition-fast), transform var(--transition-fast);
      cursor: pointer;
      user-select: none;
    }
    .neu-pill:active {
      box-shadow: var(--shadow-pressed);
      transform: scale(0.97);
    }

    /* Search box */
    .search-box {
      background-color: var(--color-canvas);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-concave);
      display: flex;
      align-items: center;
      gap: var(--space-3);
      padding: var(--space-3) var(--space-4);
    }
    .search-box i {
      color: var(--color-text-tertiary);
      font-size: 18px;
    }
    .search-box input {
      flex: 1;
      border: none;
      background: none;
      outline: none;
      font-family: var(--font-cn-body);
      font-size: var(--text-caption);
      color: var(--color-text-primary);
    }
    .search-box input::placeholder {
      color: var(--color-text-tertiary);
    }

    /* Scene card */
    .scene-card {
      background-color: var(--color-canvas);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-convex);
      padding: var(--space-4);
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: var(--space-3);
      cursor: pointer;
      transition: box-shadow var(--transition-fast), transform var(--transition-fast);
    }
    .scene-card:active {
      box-shadow: var(--shadow-pressed);
      transform: scale(0.98);
    }
    .scene-icon-wrap {
      width: 44px;
      height: 44px;
      border-radius: var(--radius-sm);
      background-color: var(--color-canvas);
      box-shadow: var(--shadow-concave-subtle);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .scene-icon-wrap i {
      font-size: 22px;
      color: var(--color-brand);
    }
    .scene-name {
      font-size: var(--text-caption);
      font-weight: var(--weight-medium);
      color: var(--color-text-primary);
    }
    .scene-desc {
      font-size: var(--text-micro);
      color: var(--color-text-tertiary);
      line-height: var(--leading-relaxed);
    }
    .scene-badge {
      font-size: var(--text-micro);
      color: var(--color-brand-text);
      background-color: var(--color-brand-subtle);
      padding: 2px 8px;
      border-radius: var(--radius-pill);
      font-weight: var(--weight-medium);
    }

    /* Tab Bar */
    .tab-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 100;
      padding: 0 var(--space-6) var(--safe-area-bottom);
      display: flex;
      justify-content: center;
    }
    .tab-bar-inner {
      display: flex;
      align-items: flex-end;
      justify-content: space-around;
      width: 100%;
      max-width: 375px;
      height: var(--tab-bar-height);
      background-color: var(--color-canvas);
      border-radius: var(--radius-xl) var(--radius-xl) 0 0;
      box-shadow: 0 -2px 12px rgba(26, 26, 26, 0.04);
      padding: 0 var(--space-4);
      position: relative;
    }
    .tab-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      padding: var(--space-2) var(--space-3);
      color: var(--tab-inactive-color);
      font-size: var(--tab-label-size);
      font-weight: var(--weight-medium);
      cursor: pointer;
      transition: color var(--transition-fast);
    }
    .tab-item.active {
      color: var(--tab-active-color);
    }
    .tab-item i { font-size: var(--tab-icon-size); }
    .shutter-btn-wrap {
      position: absolute;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%);
    }
    .shutter-btn {
      width: var(--shutter-size);
      height: var(--shutter-size);
      border-radius: var(--radius-shutter);
      background-color: var(--color-canvas);
      border: var(--shutter-border-width) solid var(--color-brand);
      box-shadow: var(--shadow-convex-brand);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: box-shadow var(--transition-fast), transform var(--transition-fast);
    }
    .shutter-btn:active {
      box-shadow: var(--shadow-pressed);
      transform: scale(0.95);
    }
    .shutter-btn i {
      color: var(--color-brand);
      font-size: 22px;
    }
  </style>
</head>
<body data-theme="warm">

  <!-- ==================== Header ==================== -->
  <header style="padding: var(--space-8) var(--page-padding) var(--space-5);">
    <h1 style="font-family: var(--font-cn-title); font-size: var(--text-h1); font-weight: var(--weight-semibold); color: var(--color-text-primary); letter-spacing: var(--tracking-snug); line-height: var(--leading-tight);">
      拍摄场景
    </h1>
    <p style="margin-top: var(--space-1); font-size: var(--text-caption); color: var(--color-text-tertiary); letter-spacing: var(--tracking-wide);">
      选择场景，获取专属拍摄建议
    </p>
  </header>

  <!-- ==================== Search ==================== -->
  <section style="padding: 0 var(--page-padding); margin-bottom: var(--space-5);">
    <div class="search-box">
      <i class="ph ph-magnifying-glass"></i>
      <input type="text" placeholder="搜索拍摄场景...">
    </div>
  </section>

  <!-- ==================== Scene Grid ==================== -->
  <section style="padding: 0 var(--page-padding); margin-bottom: var(--space-6);">
    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-4);">

      <!-- 咖啡馆 -->
      <div class="scene-card">
        <div class="scene-icon-wrap">
          <i class="ph ph-coffee"></i>
        </div>
        <div>
          <p class="scene-name">咖啡馆</p>
          <p class="scene-desc">温暖灯光与窗边自然光</p>
        </div>
        <span class="scene-badge">8 模板</span>
      </div>

      <!-- 花店 -->
      <div class="scene-card">
        <div class="scene-icon-wrap">
          <i class="ph ph-flower-lotus"></i>
        </div>
        <div>
          <p class="scene-name">花店</p>
          <p class="scene-desc">鲜花色彩与柔和光影</p>
        </div>
        <span class="scene-badge">6 模板</span>
      </div>

      <!-- 海边 -->
      <div class="scene-card">
        <div class="scene-icon-wrap">
          <i class="ph ph-wave-sine"></i>
        </div>
        <div>
          <p class="scene-name">海边</p>
          <p class="scene-desc">碧海蓝天与金色沙滩</p>
        </div>
        <span class="scene-badge">10 模板</span>
      </div>

      <!-- 街拍 -->
      <div class="scene-card">
        <div class="scene-icon-wrap">
          <i class="ph ph-street-view"></i>
        </div>
        <div>
          <p class="scene-name">街拍</p>
          <p class="scene-desc">都市街景与人文纪实</p>
        </div>
        <span class="scene-badge">12 模板</span>
      </div>

      <!-- 居家 -->
      <div class="scene-card">
        <div class="scene-icon-wrap">
          <i class="ph ph-house-line"></i>
        </div>
        <div>
          <p class="scene-name">居家</p>
          <p class="scene-desc">日常角落与温馨氛围</p>
        </div>
        <span class="scene-badge">9 模板</span>
      </div>

      <!-- 纪念日 -->
      <div class="scene-card">
        <div class="scene-icon-wrap">
          <i class="ph ph-heart"></i>
        </div>
        <div>
          <p class="scene-name">纪念日</p>
          <p class="scene-desc">烛光晚餐与仪式感</p>
        </div>
        <span class="scene-badge">5 模板</span>
      </div>

      <!-- 探店 -->
      <div class="scene-card">
        <div class="scene-icon-wrap">
          <i class="ph ph-storefront"></i>
        </div>
        <div>
          <p class="scene-name">探店</p>
          <p class="scene-desc">网红店铺与空间美学</p>
        </div>
        <span class="scene-badge">7 模板</span>
      </div>

      <!-- 夜景 -->
      <div class="scene-card">
        <div class="scene-icon-wrap">
          <i class="ph ph-moon-stars"></i>
        </div>
        <div>
          <p class="scene-name">夜景</p>
          <p class="scene-desc">霓虹灯光与长曝光</p>
        </div>
        <span class="scene-badge">11 模板</span>
      </div>

    </div>
  </section>

  <!-- ==================== Bottom Tab Bar ==================== -->
  <nav class="tab-bar">
    <div class="tab-bar-inner">
      <div class="tab-item active" style="margin-bottom: var(--space-1);">
        <i class="ph ph-house-fill"></i>
        <span>首页</span>
      </div>
      <div class="tab-item" style="margin-bottom: var(--space-1);">
        <i class="ph ph-squares-four"></i>
        <span>模板</span>
      </div>
      <div class="shutter-btn-wrap">
        <div class="shutter-btn">
          <i class="ph ph-camera"></i>
        </div>
      </div>
      <div class="tab-item" style="margin-bottom: var(--space-1);">
        <i class="ph ph-trophy"></i>
        <span>挑战</span>
      </div>
      <div class="tab-item" style="margin-bottom: var(--space-1);">
        <i class="ph ph-user-circle"></i>
        <span>我的</span>
      </div>
    </div>
  </nav>

</body>
</html>
