<!DOCTYPE html>
<html lang="zh-CN" data-theme="warm">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>如画 Lumira — 每日挑战</title>
  <link rel="stylesheet" href="../colors_and_type.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    html, body {
      width: 100%;
      min-height: 100vh;
      background-color: var(--color-canvas);
      color: var(--color-text-primary);
      font-family: var(--font-cn-body);
      font-size: var(--text-body);
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    body {
      padding-bottom: calc(var(--tab-bar-height) + var(--safe-area-bottom) + 20px);
    }

    /* --- Page Header --- */
    .page-header {
      padding: var(--space-10) var(--page-padding) var(--space-6);
    }

    .page-title {
      font-family: var(--font-cn-title);
      font-size: var(--text-h1);
      font-weight: var(--weight-semibold);
      color: var(--color-text-primary);
      letter-spacing: var(--tracking-snug);
      line-height: var(--leading-tight);
    }

    /* --- Section Title --- */
    .section-label {
      font-family: var(--font-cn-body);
      font-size: var(--text-caption);
      font-weight: var(--weight-medium);
      color: var(--color-text-tertiary);
      letter-spacing: var(--tracking-label);
      text-transform: uppercase;
      margin-bottom: var(--space-3);
    }

    /* --- Neumorphic Card --- */
    .neu-card {
      background-color: var(--color-canvas);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-convex);
      padding: var(--card-padding);
    }

    .neu-card-highlight {
      background-color: var(--color-canvas);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-convex);
      border: 2px solid var(--color-brand);
      padding: var(--card-padding);
    }

    /* --- Challenge Title --- */
    .challenge-name {
      font-family: var(--font-cn-title);
      font-size: var(--text-h2);
      font-weight: var(--weight-semibold);
      color: var(--color-text-primary);
      letter-spacing: var(--tracking-snug);
      line-height: var(--leading-snug);
    }

    /* --- Challenge Description --- */
    .challenge-desc {
      font-size: var(--text-caption);
      color: var(--color-text-secondary);
      line-height: var(--leading-relaxed);
      margin-top: var(--space-2);
    }

    /* --- Reward Tags --- */
    .reward-tags {
      display: flex;
      gap: var(--space-2);
      margin-top: var(--space-4);
    }

    .reward-tag {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: var(--space-1) var(--space-3);
      border-radius: var(--radius-pill);
      font-size: var(--text-micro);
      font-weight: var(--weight-medium);
      color: var(--color-brand-text);
      background-color: var(--color-brand-subtle);
    }

    .reward-tag i {
      font-size: 12px;
    }

    /* --- CTA Button --- */
    .cta-gold-convex {
      display: inline-flex;
      align-items: center;
      gap: var(--space-2);
      padding: var(--space-3) var(--space-6);
      background-color: var(--color-brand);
      border: none;
      border-radius: var(--radius-pill);
      box-shadow: var(--shadow-convex-brand);
      color: var(--color-text-inverse);
      font-family: var(--font-cn-body);
      font-size: var(--text-caption);
      font-weight: var(--weight-semibold);
      letter-spacing: var(--tracking-wide);
      cursor: pointer;
      transition: box-shadow var(--transition-fast), transform var(--transition-fast);
    }

    .cta-gold-convex:active {
      box-shadow: var(--shadow-pressed);
      transform: scale(0.97);
    }

    /* --- Countdown Timer --- */
    .countdown {
      display: inline-flex;
      align-items: center;
      gap: var(--space-2);
      margin-top: var(--space-4);
      font-family: var(--font-en-body);
      font-size: var(--text-caption);
      color: var(--color-text-tertiary);
      letter-spacing: var(--tracking-normal);
    }

    .countdown i {
      font-size: 14px;
    }

    .countdown-time {
      font-family: var(--font-mono);
      font-weight: var(--weight-medium);
      color: var(--color-brand);
      font-size: var(--text-caption);
    }

    /* --- Side Challenge Card --- */
    .side-card {
      background-color: var(--color-canvas);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-convex);
      padding: var(--space-4) var(--space-5);
    }

    /* --- History Row --- */
    .history-row {
      background-color: var(--color-canvas);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-convex);
      padding: var(--space-3) var(--space-5);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .history-date {
      font-family: var(--font-en-body);
      font-size: var(--text-micro);
      color: var(--color-text-tertiary);
      min-width: 60px;
    }

    .history-name {
      flex: 1;
      font-size: var(--text-caption);
      font-weight: var(--weight-medium);
      color: var(--color-text-primary);
      margin-left: var(--space-3);
    }

    .status-done {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: var(--text-micro);
      color: var(--color-success);
      font-weight: var(--weight-medium);
    }

    .status-missed {
      font-size: var(--text-micro);
      color: var(--color-text-tertiary);
    }

    /* --- Tab Bar --- */
    .tab-bar {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 375px;
      padding: 0 var(--space-4);
      padding-bottom: var(--safe-area-bottom);
      z-index: 100;
    }

    .tab-bar-inner {
      background-color: var(--color-canvas);
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow-convex);
      display: flex;
      align-items: center;
      justify-content: space-around;
      height: var(--tab-bar-height);
      padding: 0 var(--space-2);
    }

    .tab-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      text-decoration: none;
      cursor: pointer;
      flex: 1;
      padding: var(--space-2) 0;
    }

    .tab-item i {
      font-size: var(--tab-icon-size);
      color: var(--tab-inactive-color);
      transition: color var(--transition-normal);
    }

    .tab-item span {
      font-size: var(--tab-label-size);
      font-weight: var(--weight-medium);
      color: var(--tab-inactive-color);
      letter-spacing: var(--tracking-label);
      font-family: var(--font-cn-body);
      transition: color var(--transition-normal);
    }

    .tab-item.active i,
    .tab-item.active span {
      color: var(--tab-active-color);
    }

    .tab-item-shutter {
      position: relative;
      width: var(--shutter-size);
      height: var(--shutter-size);
      margin-top: -16px;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: var(--color-canvas);
      border-radius: var(--radius-shutter);
      box-shadow: var(--shadow-convex-brand);
      border: var(--shutter-border-width) solid var(--color-brand);
      cursor: pointer;
      transition: all var(--transition-normal);
    }

    .tab-item-shutter:active {
      box-shadow: var(--shadow-pressed);
    }

    .tab-item-shutter i {
      font-size: 22px;
      color: var(--color-brand);
    }
  </style>
</head>
<body>

  <!-- Page Header -->
  <div class="page-header">
    <h1 class="page-title">每日挑战</h1>
  </div>

  <!-- ==================== Main Challenge ==================== -->
  <section style="padding: 0 var(--page-padding);">
    <div class="section-label">今日主挑战</div>
    <div class="neu-card-highlight">
      <div class="challenge-name">光影对比</div>
      <div class="challenge-desc">拍摄一张明暗对比强烈的照片，用光与影的对话讲述故事。</div>

      <!-- Reward Tags -->
      <div class="reward-tags">
        <span class="reward-tag">
          <i class="ph ph-star"></i>
          +50经验
        </span>
        <span class="reward-tag">
          <i class="ph ph-puzzle-piece"></i>
          碎片 x1
        </span>
      </div>

      <!-- CTA + Countdown Row -->
      <div style="display: flex; align-items: center; justify-content: space-between; margin-top: var(--space-5);">
        <button class="cta-gold-convex">
          去完成
          <i class="ph ph-arrow-right" style="font-size: 14px;"></i>
        </button>
        <div class="countdown">
          <i class="ph ph-timer"></i>
          剩余 <span class="countdown-time">12:34:56</span>
        </div>
      </div>
    </div>
  </section>

  <!-- ==================== Side Challenges ==================== -->
  <section style="padding: 0 var(--page-padding); margin-top: var(--space-9);">
    <div class="section-label">支线挑战</div>
    <div style="display: flex; flex-direction: column; gap: var(--space-3);">

      <!-- Side Challenge 1 -->
      <div class="side-card">
        <div style="display: flex; align-items: flex-start; justify-content: space-between;">
          <div>
            <div style="font-size: var(--text-caption); font-weight: var(--weight-semibold); color: var(--color-text-primary);">极简构图</div>
            <div style="font-size: var(--text-micro); color: var(--color-text-secondary); margin-top: var(--space-1); line-height: var(--leading-relaxed);">用最少元素传达最大意境</div>
          </div>
          <button class="cta-gold-convex" style="padding: var(--space-2) var(--space-4); font-size: var(--text-micro); flex-shrink: 0;">
            去完成
          </button>
        </div>
      </div>

      <!-- Side Challenge 2 -->
      <div class="side-card">
        <div style="display: flex; align-items: flex-start; justify-content: space-between;">
          <div>
            <div style="font-size: var(--text-caption); font-weight: var(--weight-semibold); color: var(--color-text-primary);">自然光影</div>
            <div style="font-size: var(--text-micro); color: var(--color-text-secondary); margin-top: var(--space-1); line-height: var(--leading-relaxed);">捕捉自然光洒落的瞬间</div>
          </div>
          <button class="cta-gold-convex" style="padding: var(--space-2) var(--space-4); font-size: var(--text-micro); flex-shrink: 0;">
            去完成
          </button>
        </div>
      </div>

    </div>
  </section>

  <!-- ==================== Challenge History ==================== -->
  <section style="padding: 0 var(--page-padding); margin-top: var(--space-9);">
    <div class="section-label">挑战历史</div>
    <div style="display: flex; flex-direction: column; gap: var(--space-3);">

      <!-- History Row 1 -->
      <div class="history-row">
        <span class="history-date">07/08</span>
        <span class="history-name">色彩碰撞</span>
        <span class="status-done">
          <i class="ph ph-check-circle-fill" style="font-size: 14px;"></i>
          已完成
        </span>
      </div>

      <!-- History Row 2 -->
      <div class="history-row">
        <span class="history-date">07/07</span>
        <span class="history-name">对称之美</span>
        <span class="status-done">
          <i class="ph ph-check-circle-fill" style="font-size: 14px;"></i>
          已完成
        </span>
      </div>

      <!-- History Row 3 -->
      <div class="history-row">
        <span class="history-date">07/06</span>
        <span class="history-name">街头故事</span>
        <span class="status-missed">未完成</span>
      </div>

      <!-- History Row 4 -->
      <div class="history-row">
        <span class="history-date">07/05</span>
        <span class="history-name">微观世界</span>
        <span class="status-done">
          <i class="ph ph-check-circle-fill" style="font-size: 14px;"></i>
          已完成
        </span>
      </div>

    </div>
  </section>

  <!-- ==================== Tab Bar ==================== -->
  <nav class="tab-bar">
    <div class="tab-bar-inner">
      <!-- 首页 -->
      <a class="tab-item" href="home.html">
        <i class="ph ph-house"></i>
        <span>首页</span>
      </a>
      <!-- 模板 -->
      <a class="tab-item" href="templates.html">
        <i class="ph ph-squares-four"></i>
        <span>模板</span>
      </a>
      <!-- 快门 (Center) -->
      <a class="tab-item" href="capture.html">
        <div class="tab-item-shutter">
          <i class="ph ph-camera"></i>
        </div>
      </a>
      <!-- 挑战 (Active) -->
      <a class="tab-item active" href="challenge.html">
        <i class="ph ph-trophy"></i>
        <span>挑战</span>
      </a>
      <!-- 我的 -->
      <a class="tab-item" href="profile.html">
        <i class="ph ph-user-circle"></i>
        <span>我的</span>
      </a>
    </div>
  </nav>

</body>
</html>
