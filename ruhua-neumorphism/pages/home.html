<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>如画 Lumira — 首页</title>
  <link rel="stylesheet" href="../colors_and_type.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <style>
    /* ========== Home Page Base ========== */
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    html {
      font-size: 16px;
      scroll-behavior: smooth;
    }

    body {
      background-color: var(--color-canvas);
      font-family: var(--font-cn-body);
      font-size: var(--text-body);
      color: var(--color-text-primary);
      line-height: var(--leading-normal);
      min-height: 100vh;
      padding-bottom: calc(var(--tab-bar-height) + var(--shutter-size) / 2 + var(--safe-area-bottom) + 20px);
      overflow-x: hidden;
    }

    /* ========== Section Title ========== */
    .section-title {
      font-family: var(--font-cn-title);
      font-size: var(--text-h2);
      font-weight: var(--weight-semibold);
      color: var(--color-text-primary);
      letter-spacing: var(--tracking-snug);
      line-height: var(--leading-snug);
    }

    /* ========== Neumorphic Card (Convex) ========== */
    .neu-card {
      background-color: var(--color-canvas);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-convex);
    }

    /* ========== Neumorphic Inset (Concave) ========== */
    .neu-inset {
      background-color: var(--color-canvas);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-concave);
    }

    /* ========== Neumorphic Pill (Subtle Convex) ========== */
    .neu-pill {
      background-color: var(--color-canvas);
      border-radius: var(--radius-pill);
      box-shadow: var(--shadow-convex-subtle);
      transition: box-shadow var(--transition-fast), transform var(--transition-fast);
      cursor: pointer;
      user-select: none;
    }
    .neu-pill:active {
      box-shadow: var(--shadow-pressed);
      transform: scale(0.97);
    }

    /* ========== Neumorphic Small Block ========== */
    .neu-block {
      background-color: var(--color-canvas);
      border-radius: var(--radius-sm);
      box-shadow: var(--shadow-convex-subtle);
    }

    /* ========== CTA Button (Convex Brand) ========== */
    .cta-btn {
      display: inline-flex;
      align-items: center;
      gap: var(--space-2);
      padding: var(--space-3) var(--space-6);
      background-color: var(--color-canvas);
      border: none;
      border-radius: var(--radius-pill);
      box-shadow: var(--shadow-convex);
      color: var(--color-brand);
      font-family: var(--font-cn-body);
      font-size: var(--text-caption);
      font-weight: var(--weight-medium);
      letter-spacing: var(--tracking-wide);
      cursor: pointer;
      transition: box-shadow var(--transition-fast), transform var(--transition-fast);
    }
    .cta-btn:active {
      box-shadow: var(--shadow-pressed);
      transform: scale(0.97);
    }

    /* ========== Scrollbar Hide ========== */
    .hide-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    .hide-scrollbar::-webkit-scrollbar {
      display: none;
    }

    /* ========== Bottom Tab Bar ========== */
    .tab-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 100;
      padding: 0 var(--space-6) var(--safe-area-bottom);
      display: flex;
      justify-content: center;
    }

    .tab-bar-inner {
      display: flex;
      align-items: flex-end;
      justify-content: space-around;
      width: 100%;
      max-width: 375px;
      height: var(--tab-bar-height);
      background-color: var(--color-canvas);
      border-radius: var(--radius-xl) var(--radius-xl) 0 0;
      box-shadow: 0 -2px 12px rgba(26, 26, 26, 0.04);
      padding: 0 var(--space-4);
      position: relative;
    }

    .tab-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      padding: var(--space-2) var(--space-3);
      color: var(--tab-inactive-color);
      font-size: var(--tab-label-size);
      font-weight: var(--weight-medium);
      cursor: pointer;
      transition: color var(--transition-fast);
      position: relative;
    }

    .tab-item.active {
      color: var(--tab-active-color);
    }

    .tab-item i {
      font-size: var(--tab-icon-size);
    }

    /* Shutter Button — center, raised above tab bar */
    .shutter-btn-wrap {
      position: absolute;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%);
    }

    .shutter-btn {
      width: var(--shutter-size);
      height: var(--shutter-size);
      border-radius: var(--radius-shutter);
      background-color: var(--color-canvas);
      border: var(--shutter-border-width) solid var(--color-brand);
      box-shadow: var(--shadow-convex-brand);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: box-shadow var(--transition-fast), transform var(--transition-fast);
    }
    .shutter-btn:active {
      box-shadow: var(--shadow-pressed);
      transform: scale(0.95);
    }
    .shutter-btn i {
      color: var(--color-brand);
      font-size: 22px;
    }

    /* ========== Placeholder Image Block ========== */
    .img-placeholder {
      background-color: var(--color-surface-alt);
      border-radius: var(--radius-sm);
    }
  </style>
</head>
<body data-theme="warm">

  <!-- ==================== Header ==================== -->
  <header style="padding: var(--space-10) var(--page-padding) var(--space-6);">
    <h1 style="font-family: var(--font-cn-title); font-size: var(--text-h1); font-weight: var(--weight-semibold); color: var(--color-text-primary); letter-spacing: var(--tracking-snug); line-height: var(--leading-tight);">
      如画
    </h1>
    <p style="margin-top: var(--space-1); font-size: var(--text-caption); color: var(--color-text-tertiary); letter-spacing: var(--tracking-wide);">
      用镜头书写日常的诗
    </p>
  </header>

  <!-- ==================== 今日灵感 ==================== -->
  <section style="padding: 0 var(--page-padding);">
    <h2 class="section-title" style="margin-bottom: var(--space-4);">今日灵感</h2>
    <div class="neu-card" style="padding: var(--card-padding);">
      <p style="font-size: var(--text-body); color: var(--color-text-secondary); line-height: var(--leading-relaxed); margin-bottom: var(--space-5);">
        试试在逆光中寻找剪影的轮廓 — 光线从背后勾勒形状，让日常物件变得如水墨画般写意。
      </p>
      <div style="display: flex; align-items: center; justify-content: space-between;">
        <span style="font-size: var(--text-micro); color: var(--color-text-tertiary);">
          <i class="ph ph-sun-dim" style="font-size: 14px; vertical-align: -2px; margin-right: 4px;"></i>
          逆光剪影
        </span>
        <button class="cta-btn">
          试试看
          <i class="ph ph-arrow-right" style="font-size: 14px;"></i>
        </button>
      </div>
    </div>
  </section>

  <!-- ==================== 最近拍摄 ==================== -->
  <section style="margin-top: var(--section-gap); padding: 0 var(--page-padding);">
    <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: var(--space-4);">
      <h2 class="section-title">最近拍摄</h2>
      <span style="font-size: var(--text-caption); color: var(--color-text-tertiary); cursor: pointer;">
        全部
        <i class="ph ph-caret-right" style="font-size: 12px; vertical-align: -1px;"></i>
      </span>
    </div>
    <div class="neu-inset" style="padding: var(--space-3); overflow-x: auto;" class="hide-scrollbar">
      <div class="hide-scrollbar" style="display: flex; gap: var(--space-3); overflow-x: auto; padding-bottom: var(--space-1);">
        <!-- Placeholder thumbnails -->
        <div class="img-placeholder" style="min-width: 100px; height: 100px; flex-shrink: 0;"></div>
        <div class="img-placeholder" style="min-width: 100px; height: 100px; flex-shrink: 0;"></div>
        <div class="img-placeholder" style="min-width: 100px; height: 100px; flex-shrink: 0;"></div>
        <div class="img-placeholder" style="min-width: 100px; height: 100px; flex-shrink: 0;"></div>
        <div class="img-placeholder" style="min-width: 100px; height: 100px; flex-shrink: 0;"></div>
      </div>
    </div>
  </section>

  <!-- ==================== 推荐模板 ==================== -->
  <section style="margin-top: var(--section-gap); padding: 0 var(--page-padding);">
    <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: var(--space-4);">
      <h2 class="section-title">推荐模板</h2>
      <span style="font-size: var(--text-caption); color: var(--color-text-tertiary); cursor: pointer;">
        更多
        <i class="ph ph-caret-right" style="font-size: 12px; vertical-align: -1px;"></i>
      </span>
    </div>
    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: var(--card-gap);">
      <!-- Template Card 1 -->
      <div class="neu-card" style="overflow: hidden;">
        <div class="img-placeholder" style="width: 100%; aspect-ratio: 3/4;"></div>
        <div style="padding: var(--space-3) var(--space-4) var(--space-4);">
          <p style="font-size: var(--text-caption); font-weight: var(--weight-medium); color: var(--color-text-primary); margin-bottom: var(--space-2);">
            水墨留白
          </p>
          <span class="neu-pill" style="display: inline-block; padding: 2px 10px; font-size: var(--text-micro); color: var(--color-brand-text);">
            风景
          </span>
        </div>
      </div>
      <!-- Template Card 2 -->
      <div class="neu-card" style="overflow: hidden;">
        <div class="img-placeholder" style="width: 100%; aspect-ratio: 3/4;"></div>
        <div style="padding: var(--space-3) var(--space-4) var(--space-4);">
          <p style="font-size: var(--text-caption); font-weight: var(--weight-medium); color: var(--color-text-primary); margin-bottom: var(--space-2);">
            暖光日记
          </p>
          <span class="neu-pill" style="display: inline-block; padding: 2px 10px; font-size: var(--text-micro); color: var(--color-brand-text);">
            日常
          </span>
        </div>
      </div>
      <!-- Template Card 3 -->
      <div class="neu-card" style="overflow: hidden;">
        <div class="img-placeholder" style="width: 100%; aspect-ratio: 3/4;"></div>
        <div style="padding: var(--space-3) var(--space-4) var(--space-4);">
          <p style="font-size: var(--text-caption); font-weight: var(--weight-medium); color: var(--color-text-primary); margin-bottom: var(--space-2);">
            古胶片色
          </p>
          <span class="neu-pill" style="display: inline-block; padding: 2px 10px; font-size: var(--text-micro); color: var(--color-brand-text);">
            复古
          </span>
        </div>
      </div>
      <!-- Template Card 4 -->
      <div class="neu-card" style="overflow: hidden;">
        <div class="img-placeholder" style="width: 100%; aspect-ratio: 3/4;"></div>
        <div style="padding: var(--space-3) var(--space-4) var(--space-4);">
          <p style="font-size: var(--text-caption); font-weight: var(--weight-medium); color: var(--color-text-primary); margin-bottom: var(--space-2);">
            极简构框
          </p>
          <span class="neu-pill" style="display: inline-block; padding: 2px 10px; font-size: var(--text-micro); color: var(--color-brand-text);">
            建筑
          </span>
        </div>
      </div>
    </div>
  </section>

  <!-- ==================== 拍摄场景 ==================== -->
  <section style="margin-top: var(--section-gap); padding: 0 var(--page-padding);">
    <h2 class="section-title" style="margin-bottom: var(--space-4);">拍摄场景</h2>
    <div class="hide-scrollbar" style="display: flex; gap: var(--space-3); overflow-x: auto; padding-bottom: var(--space-1);">
      <span class="neu-pill" style="padding: var(--space-2) var(--space-4); font-size: var(--text-caption); color: var(--color-text-secondary); white-space: nowrap;">日出日落</span>
      <span class="neu-pill" style="padding: var(--space-2) var(--space-4); font-size: var(--text-caption); color: var(--color-text-secondary); white-space: nowrap;">城市街拍</span>
      <span class="neu-pill" style="padding: var(--space-2) var(--space-4); font-size: var(--text-caption); color: var(--color-text-secondary); white-space: nowrap;">花草微距</span>
      <span class="neu-pill" style="padding: var(--space-2) var(--space-4); font-size: var(--text-caption); color: var(--color-text-secondary); white-space: nowrap;">美食静物</span>
      <span class="neu-pill" style="padding: var(--space-2) var(--space-4); font-size: var(--text-caption); color: var(--color-text-secondary); white-space: nowrap;">人像写真</span>
      <span class="neu-pill" style="padding: var(--space-2) var(--space-4); font-size: var(--text-caption); color: var(--color-text-secondary); white-space: nowrap;">宠物生活</span>
      <span class="neu-pill" style="padding: var(--space-2) var(--space-4); font-size: var(--text-caption); color: var(--color-text-secondary); white-space: nowrap;">夜景灯光</span>
      <span class="neu-pill" style="padding: var(--space-2) var(--space-4); font-size: var(--text-caption); color: var(--color-text-secondary); white-space: nowrap;">雨后倒影</span>
    </div>
  </section>

  <!-- ==================== 碎片收集 ==================== -->
  <section style="margin-top: var(--section-gap); padding: 0 var(--page-padding) var(--space-12);">
    <h2 class="section-title" style="margin-bottom: var(--space-4);">碎片收集</h2>
    <div style="display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--space-3);">
      <div class="neu-block" style="aspect-ratio: 1; display: flex; align-items: center; justify-content: center;">
        <span style="font-size: var(--text-caption); color: var(--color-brand); font-weight: var(--weight-medium);">3</span>
      </div>
      <div class="neu-block" style="aspect-ratio: 1; display: flex; align-items: center; justify-content: center;">
        <span style="font-size: var(--text-caption); color: var(--color-brand); font-weight: var(--weight-medium);">7</span>
      </div>
      <div class="neu-block" style="aspect-ratio: 1; display: flex; align-items: center; justify-content: center;">
        <span style="font-size: var(--text-caption); color: var(--color-brand); font-weight: var(--weight-medium);">1</span>
      </div>
      <div class="neu-block" style="aspect-ratio: 1; display: flex; align-items: center; justify-content: center;">
        <span style="font-size: var(--text-caption); color: var(--color-text-tertiary); font-weight: var(--weight-medium);">0</span>
      </div>
      <div class="neu-block" style="aspect-ratio: 1; display: flex; align-items: center; justify-content: center;">
        <span style="font-size: var(--text-caption); color: var(--color-brand); font-weight: var(--weight-medium);">5</span>
      </div>
      <div class="neu-block" style="aspect-ratio: 1; display: flex; align-items: center; justify-content: center;">
        <span style="font-size: var(--text-caption); color: var(--color-text-tertiary); font-weight: var(--weight-medium);">0</span>
      </div>
      <div class="neu-block" style="aspect-ratio: 1; display: flex; align-items: center; justify-content: center;">
        <span style="font-size: var(--text-caption); color: var(--color-brand); font-weight: var(--weight-medium);">2</span>
      </div>
      <div class="neu-block" style="aspect-ratio: 1; display: flex; align-items: center; justify-content: center;">
        <span style="font-size: var(--text-caption); color: var(--color-text-tertiary); font-weight: var(--weight-medium);">0</span>
      </div>
    </div>
  </section>

  <!-- ==================== Bottom Tab Bar ==================== -->
  <nav class="tab-bar">
    <div class="tab-bar-inner">
      <!-- Tab: Home (active) -->
      <div class="tab-item active" style="margin-bottom: var(--space-1);">
        <i class="ph ph-house-fill"></i>
        <span>首页</span>
      </div>
      <!-- Tab: Templates -->
      <div class="tab-item" style="margin-bottom: var(--space-1);">
        <i class="ph ph-squares-four"></i>
        <span>模板</span>
      </div>
      <!-- Center Shutter -->
      <div class="shutter-btn-wrap">
        <div class="shutter-btn">
          <i class="ph ph-camera"></i>
        </div>
      </div>
      <!-- Tab: Challenges -->
      <div class="tab-item" style="margin-bottom: var(--space-1);">
        <i class="ph ph-trophy"></i>
        <span>挑战</span>
      </div>
      <!-- Tab: Profile -->
      <div class="tab-item" style="margin-bottom: var(--space-1);">
        <i class="ph ph-user-circle"></i>
        <span>我的</span>
      </div>
    </div>
  </nav>

</body>
</html>
