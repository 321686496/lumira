<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>如画 Lumira — 摄影美学院</title>
  <link rel="stylesheet" href="../colors_and_type.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html { font-size: 16px; scroll-behavior: smooth; }
    body {
      background-color: var(--color-canvas);
      font-family: var(--font-cn-body);
      font-size: var(--text-body);
      color: var(--color-text-primary);
      line-height: var(--leading-normal);
      min-height: 100vh;
      padding-bottom: calc(var(--tab-bar-height) + var(--shutter-size) / 2 + var(--safe-area-bottom) + 20px);
      overflow-x: hidden;
    }

    .neu-card {
      background-color: var(--color-canvas);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-convex);
    }
    .neu-inset {
      background-color: var(--color-canvas);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-concave);
    }
    .neu-inset-subtle {
      background-color: var(--color-canvas);
      border-radius: var(--radius-pill);
      box-shadow: var(--shadow-concave-subtle);
    }
    .neu-pill {
      background-color: var(--color-canvas);
      border-radius: var(--radius-pill);
      box-shadow: var(--shadow-convex-subtle);
      transition: box-shadow var(--transition-fast), transform var(--transition-fast);
      cursor: pointer;
      user-select: none;
      white-space: nowrap;
    }
    .neu-pill:active {
      box-shadow: var(--shadow-pressed);
      transform: scale(0.97);
    }
    .neu-pill.active {
      box-shadow: var(--shadow-pressed);
      color: var(--color-brand);
    }

    .section-title {
      font-family: var(--font-cn-title);
      font-size: var(--text-h2);
      font-weight: var(--weight-semibold);
      color: var(--color-text-primary);
      letter-spacing: var(--tracking-snug);
      line-height: var(--leading-snug);
    }

    /* Progress bar */
    .progress-track {
      background-color: var(--color-canvas);
      border-radius: var(--radius-pill);
      box-shadow: var(--shadow-concave-subtle);
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      border-radius: var(--radius-pill);
      background: linear-gradient(90deg, var(--color-brand), var(--color-brand-light));
    }

    /* Thumbnail placeholder */
    .thumb-placeholder {
      background-color: var(--color-surface-alt);
      border-radius: var(--radius-sm);
      flex-shrink: 0;
    }

    .hide-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    .hide-scrollbar::-webkit-scrollbar { display: none; }

    /* ===== Bottom Tab Bar ===== */
    .tab-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 100;
      padding: 0 var(--space-6) var(--safe-area-bottom);
      display: flex;
      justify-content: center;
    }
    .tab-bar-inner {
      display: flex;
      align-items: flex-end;
      justify-content: space-around;
      width: 100%;
      max-width: 375px;
      height: var(--tab-bar-height);
      background-color: var(--color-canvas);
      border-radius: var(--radius-xl) var(--radius-xl) 0 0;
      box-shadow: 0 -2px 12px rgba(26, 26, 26, 0.04);
      padding: 0 var(--space-4);
      position: relative;
    }
    .tab-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      padding: var(--space-2) var(--space-3);
      color: var(--tab-inactive-color);
      font-size: var(--tab-label-size);
      font-weight: var(--weight-medium);
      cursor: pointer;
      transition: color var(--transition-fast);
    }
    .tab-item.active { color: var(--tab-active-color); }
    .tab-item i { font-size: var(--tab-icon-size); }
    .shutter-btn-wrap {
      position: absolute;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%);
    }
    .shutter-btn {
      width: var(--shutter-size);
      height: var(--shutter-size);
      border-radius: var(--radius-shutter);
      background-color: var(--color-canvas);
      border: var(--shutter-border-width) solid var(--color-brand);
      box-shadow: var(--shadow-convex-brand);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: box-shadow var(--transition-fast), transform var(--transition-fast);
    }
    .shutter-btn:active {
      box-shadow: var(--shadow-pressed);
      transform: scale(0.95);
    }
    .shutter-btn i {
      color: var(--color-brand);
      font-size: 22px;
    }
  </style>
</head>
<body data-theme="warm">

  <!-- ==================== Header ==================== -->
  <header style="padding: var(--space-10) var(--page-padding) var(--space-6);">
    <h1 class="section-title" style="font-size: var(--text-h1);">摄影美学院</h1>
    <p style="margin-top: var(--space-1); font-size: var(--text-caption); color: var(--color-text-tertiary); letter-spacing: var(--tracking-wide);">
      从零开始，系统学习摄影美学
    </p>
  </header>

  <!-- ==================== Category Tags ==================== -->
  <section style="padding: 0 var(--page-padding);">
    <div class="hide-scrollbar" style="display: flex; gap: var(--space-2); overflow-x: auto; padding-bottom: var(--space-2);">
      <span class="neu-pill active" style="padding: var(--space-2) var(--space-4); font-size: var(--text-caption); color: var(--color-brand);">全部</span>
      <span class="neu-pill" style="padding: var(--space-2) var(--space-4); font-size: var(--text-caption); color: var(--color-text-secondary);">构图</span>
      <span class="neu-pill" style="padding: var(--space-2) var(--space-4); font-size: var(--text-caption); color: var(--color-text-secondary);">光线</span>
      <span class="neu-pill" style="padding: var(--space-2) var(--space-4); font-size: var(--text-caption); color: var(--color-text-secondary);">姿势</span>
      <span class="neu-pill" style="padding: var(--space-2) var(--space-4); font-size: var(--text-caption); color: var(--color-text-secondary);">后期</span>
      <span class="neu-pill" style="padding: var(--space-2) var(--space-4); font-size: var(--text-caption); color: var(--color-text-secondary);">场景</span>
    </div>
  </section>

  <!-- ==================== Course List ==================== -->
  <section style="margin-top: var(--space-8); padding: 0 var(--page-padding); display: flex; flex-direction: column; gap: var(--space-4);">

    <!-- Course 1 -->
    <a href="academy-detail.html" style="text-decoration: none; color: inherit;">
      <div class="neu-card" style="padding: var(--space-4); display: flex; gap: var(--space-4);">
        <div class="thumb-placeholder" style="width: 80px; height: 60px;">
          <i class="ph ph-image" style="font-size: 20px; color: var(--color-text-tertiary); display: flex; align-items: center; justify-content: center; width: 100%; height: 100%;"></i>
        </div>
        <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: center;">
          <p style="font-size: var(--text-caption); font-weight: var(--weight-medium); color: var(--color-text-primary); margin-bottom: var(--space-1);">
            构图的艺术：从入门到精通
          </p>
          <p style="font-size: var(--text-micro); color: var(--color-text-tertiary); margin-bottom: var(--space-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">
            学会三分法、引导线、对称构图等核心技巧
          </p>
          <div style="display: flex; align-items: center; justify-content: space-between;">
            <span class="neu-pill" style="padding: 2px 10px; font-size: var(--text-micro); color: var(--color-brand-text);">入门</span>
            <div style="flex: 1; max-width: 80px; margin: 0 var(--space-3);">
              <div class="progress-track" style="height: 4px;">
                <div class="progress-fill" style="width: 60%;"></div>
              </div>
            </div>
            <span style="font-size: var(--text-micro); color: var(--color-text-tertiary);">3/5</span>
          </div>
        </div>
      </div>
    </a>

    <!-- Course 2 -->
    <a href="academy-detail.html" style="text-decoration: none; color: inherit;">
      <div class="neu-card" style="padding: var(--space-4); display: flex; gap: var(--space-4);">
        <div class="thumb-placeholder" style="width: 80px; height: 60px;">
          <i class="ph ph-sun" style="font-size: 20px; color: var(--color-text-tertiary); display: flex; align-items: center; justify-content: center; width: 100%; height: 100%;"></i>
        </div>
        <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: center;">
          <p style="font-size: var(--text-caption); font-weight: var(--weight-medium); color: var(--color-text-primary); margin-bottom: var(--space-1);">
            光影密码：自然光运用指南
          </p>
          <p style="font-size: var(--text-micro); color: var(--color-text-tertiary); margin-bottom: var(--space-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">
            掌握晨昏光线、逆光、侧光的拍摄技巧
          </p>
          <div style="display: flex; align-items: center; justify-content: space-between;">
            <span class="neu-pill" style="padding: 2px 10px; font-size: var(--text-micro); color: var(--color-brand-text);">进阶</span>
            <div style="flex: 1; max-width: 80px; margin: 0 var(--space-3);">
              <div class="progress-track" style="height: 4px;">
                <div class="progress-fill" style="width: 25%;"></div>
              </div>
            </div>
            <span style="font-size: var(--text-micro); color: var(--color-text-tertiary);">1/4</span>
          </div>
        </div>
      </div>
    </a>

    <!-- Course 3 -->
    <a href="academy-detail.html" style="text-decoration: none; color: inherit;">
      <div class="neu-card" style="padding: var(--space-4); display: flex; gap: var(--space-4);">
        <div class="thumb-placeholder" style="width: 80px; height: 60px;">
          <i class="ph ph-person-arms-spread" style="font-size: 20px; color: var(--color-text-tertiary); display: flex; align-items: center; justify-content: center; width: 100%; height: 100%;"></i>
        </div>
        <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: center;">
          <p style="font-size: var(--text-caption); font-weight: var(--weight-medium); color: var(--color-text-primary); margin-bottom: var(--space-1);">
            人像摆拍：自然 pose 全攻略
          </p>
          <p style="font-size: var(--text-micro); color: var(--color-text-tertiary); margin-bottom: var(--space-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">
            告别僵硬，学会放松自然的拍照姿势
          </p>
          <div style="display: flex; align-items: center; justify-content: space-between;">
            <span class="neu-pill" style="padding: 2px 10px; font-size: var(--text-micro); color: var(--color-brand-text);">入门</span>
            <div style="flex: 1; max-width: 80px; margin: 0 var(--space-3);">
              <div class="progress-track" style="height: 4px;">
                <div class="progress-fill" style="width: 0%;"></div>
              </div>
            </div>
            <span style="font-size: var(--text-micro); color: var(--color-text-tertiary);">0/6</span>
          </div>
        </div>
      </div>
    </a>

    <!-- Course 4 -->
    <a href="academy-detail.html" style="text-decoration: none; color: inherit;">
      <div class="neu-card" style="padding: var(--space-4); display: flex; gap: var(--space-4);">
        <div class="thumb-placeholder" style="width: 80px; height: 60px;">
          <i class="ph ph-magic-wand" style="font-size: 20px; color: var(--color-text-tertiary); display: flex; align-items: center; justify-content: center; width: 100%; height: 100%;"></i>
        </div>
        <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: center;">
          <p style="font-size: var(--text-caption); font-weight: var(--weight-medium); color: var(--color-text-primary); margin-bottom: var(--space-1);">
            手机后期：轻修出大片质感
          </p>
          <p style="font-size: var(--text-micro); color: var(--color-text-tertiary); margin-bottom: var(--space-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">
            色调调整、局部精修、风格化处理技巧
          </p>
          <div style="display: flex; align-items: center; justify-content: space-between;">
            <span class="neu-pill" style="padding: 2px 10px; font-size: var(--text-micro); color: var(--color-brand-text);">进阶</span>
            <div style="flex: 1; max-width: 80px; margin: 0 var(--space-3);">
              <div class="progress-track" style="height: 4px;">
                <div class="progress-fill" style="width: 50%;"></div>
              </div>
            </div>
            <span style="font-size: var(--text-micro); color: var(--color-text-tertiary);">2/4</span>
          </div>
        </div>
      </div>
    </a>

    <!-- Course 5 -->
    <a href="academy-detail.html" style="text-decoration: none; color: inherit;">
      <div class="neu-card" style="padding: var(--space-4); display: flex; gap: var(--space-4);">
        <div class="thumb-placeholder" style="width: 80px; height: 60px;">
          <i class="ph ph-tree" style="font-size: 20px; color: var(--color-text-tertiary); display: flex; align-items: center; justify-content: center; width: 100%; height: 100%;"></i>
        </div>
        <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: center;">
          <p style="font-size: var(--text-caption); font-weight: var(--weight-medium); color: var(--color-text-primary); margin-bottom: var(--space-1);">
            场景美学：咖啡馆与街头摄影
          </p>
          <p style="font-size: var(--text-micro); color: var(--color-text-tertiary); margin-bottom: var(--space-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">
            在日常场景中发现并创造美的画面
          </p>
          <div style="display: flex; align-items: center; justify-content: space-between;">
            <span class="neu-pill" style="padding: 2px 10px; font-size: var(--text-micro); color: var(--color-brand-text);">高级</span>
            <div style="flex: 1; max-width: 80px; margin: 0 var(--space-3);">
              <div class="progress-track" style="height: 4px;">
                <div class="progress-fill" style="width: 0%;"></div>
              </div>
            </div>
            <span style="font-size: var(--text-micro); color: var(--color-text-tertiary);">0/5</span>
          </div>
        </div>
      </div>
    </a>

  </section>

  <!-- Bottom spacer -->
  <div style="height: var(--space-12);"></div>

  <!-- ==================== Bottom Tab Bar (我的 active) ==================== -->
  <nav class="tab-bar">
    <div class="tab-bar-inner">
      <div class="tab-item" style="margin-bottom: var(--space-1);">
        <i class="ph ph-house"></i>
        <span>首页</span>
      </div>
      <div class="tab-item" style="margin-bottom: var(--space-1);">
        <i class="ph ph-squares-four"></i>
        <span>模板</span>
      </div>
      <div class="shutter-btn-wrap">
        <div class="shutter-btn">
          <i class="ph ph-camera"></i>
        </div>
      </div>
      <div class="tab-item" style="margin-bottom: var(--space-1);">
        <i class="ph ph-trophy"></i>
        <span>挑战</span>
      </div>
      <div class="tab-item active" style="margin-bottom: var(--space-1);">
        <i class="ph ph-user-circle-fill"></i>
        <span>我的</span>
      </div>
    </div>
  </nav>

</body>
</html>
