<!DOCTYPE html>
<html lang="zh-CN" data-theme="warm">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>如画 Lumira - 模板详情</title>
  <link rel="stylesheet" href="../colors_and_type.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600&family=Noto+Sans+SC:wght@400;500;600&family=Newsreader:ital,wght@0,400;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%;
      min-height: 100vh;
      background-color: var(--color-canvas);
      color: var(--color-text-primary);
      font-family: var(--font-cn-body);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    body {
      padding-bottom: calc(var(--tab-bar-height) + var(--safe-area-bottom) + 100px);
    }

    /* --- Top Navigation Bar --- */
    .top-nav {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: var(--space-5) var(--page-padding) var(--space-4);
      position: relative;
    }

    .top-nav-back {
      position: absolute;
      left: var(--page-padding);
      width: 40px;
      height: 40px;
      border-radius: var(--radius-shutter);
      background-color: var(--color-canvas);
      box-shadow: var(--shadow-convex-subtle);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      text-decoration: none;
      transition: box-shadow var(--transition-normal);
    }

    .top-nav-back:active {
      box-shadow: var(--shadow-pressed);
    }

    .top-nav-back i {
      font-size: 20px;
      color: var(--color-text-secondary);
    }

    .top-nav-title {
      font-family: var(--font-cn-title);
      font-size: var(--text-h2);
      font-weight: var(--weight-semibold);
      color: var(--color-text-primary);
      letter-spacing: var(--tracking-snug);
    }

    /* --- Large Preview Area (Neumorphism Concave Inset) --- */
    .preview-area {
      margin: 0 var(--page-padding) var(--space-6);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-concave);
      aspect-ratio: 3 / 4;
      overflow: hidden;
      position: relative;
    }

    .preview-placeholder {
      width: 100%;
      height: 100%;
      background: linear-gradient(
        145deg,
        var(--color-surface-alt) 0%,
        var(--color-divider) 40%,
        var(--color-surface-alt) 70%,
        var(--color-divider) 100%
      );
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: var(--space-3);
    }

    .preview-placeholder i {
      font-size: 48px;
      color: var(--color-text-tertiary);
      opacity: 0.35;
    }

    .preview-placeholder span {
      font-size: var(--text-caption);
      color: var(--color-text-tertiary);
      letter-spacing: var(--tracking-wide);
    }

    /* --- Template Info Section --- */
    .info-section {
      padding: 0 var(--page-padding);
      margin-bottom: var(--space-6);
    }

    .template-name {
      font-family: var(--font-cn-title);
      font-size: var(--text-h1);
      font-weight: var(--weight-semibold);
      color: var(--color-text-primary);
      letter-spacing: var(--tracking-snug);
      line-height: var(--leading-tight);
      margin-bottom: var(--space-2);
    }

    .template-desc {
      font-family: var(--font-cn-body);
      font-size: var(--text-body);
      color: var(--color-text-secondary);
      line-height: var(--leading-relaxed);
      letter-spacing: var(--tracking-normal);
    }

    /* --- Tags Area --- */
    .tags-area {
      padding: 0 var(--page-padding);
      margin-bottom: var(--space-6);
      display: flex;
      gap: var(--space-2);
      flex-wrap: wrap;
    }

    .tag-pill {
      display: inline-flex;
      align-items: center;
      padding: var(--space-2) var(--space-4);
      border-radius: var(--radius-pill);
      font-size: var(--text-caption);
      font-weight: var(--weight-medium);
      letter-spacing: var(--tracking-label);
      color: var(--color-text-secondary);
      background-color: var(--color-canvas);
      box-shadow: var(--shadow-convex-subtle);
    }

    /* --- Info Card (Neumorphism Convex) --- */
    .info-card {
      margin: 0 var(--page-padding) var(--space-5);
      background-color: var(--color-canvas);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-convex);
      padding: var(--space-5);
    }

    .info-card-title {
      font-family: var(--font-cn-title);
      font-size: var(--text-h2);
      font-weight: var(--weight-semibold);
      color: var(--color-text-primary);
      letter-spacing: var(--tracking-snug);
      margin-bottom: var(--space-5);
    }

    /* Camera Parameters */
    .param-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: var(--space-4);
    }

    .param-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: var(--space-2);
    }

    .param-label {
      font-size: var(--text-micro);
      font-weight: var(--weight-medium);
      color: var(--color-text-tertiary);
      letter-spacing: var(--tracking-label);
      text-align: center;
    }

    .param-value {
      font-family: var(--font-mono);
      font-size: var(--text-caption);
      font-weight: var(--weight-semibold);
      color: var(--color-text-primary);
      letter-spacing: var(--tracking-snug);
    }

    .param-divider {
      width: 100%;
      height: 1px;
      background-color: var(--color-divider);
      margin: var(--space-4) 0;
    }

    /* Scene Suggestions */
    .suggestion-list {
      display: flex;
      flex-direction: column;
      gap: var(--space-4);
    }

    .suggestion-item {
      display: flex;
      align-items: flex-start;
      gap: var(--space-3);
    }

    .suggestion-icon {
      width: 32px;
      height: 32px;
      border-radius: var(--radius-sm);
      background-color: var(--color-canvas);
      box-shadow: var(--shadow-convex-subtle);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .suggestion-icon i {
      font-size: 16px;
      color: var(--color-brand);
    }

    .suggestion-content {
      flex: 1;
    }

    .suggestion-label {
      font-size: var(--text-caption);
      font-weight: var(--weight-semibold);
      color: var(--color-text-primary);
      letter-spacing: var(--tracking-snug);
      margin-bottom: 2px;
    }

    .suggestion-text {
      font-size: var(--text-caption);
      color: var(--color-text-secondary);
      line-height: var(--leading-normal);
    }

    /* --- Fixed CTA Button Area --- */
    .cta-area {
      position: fixed;
      bottom: calc(var(--tab-bar-height) + var(--safe-area-bottom) + 8px);
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - var(--page-padding) * 2);
      max-width: calc(375px - var(--page-padding) * 2);
      z-index: 90;
    }

    .cta-button {
      width: 100%;
      height: 52px;
      border-radius: var(--radius-lg);
      border: none;
      cursor: pointer;
      font-family: var(--font-cn-body);
      font-size: var(--text-body);
      font-weight: var(--weight-semibold);
      letter-spacing: var(--tracking-wide);
      color: var(--color-canvas);
      background-color: var(--color-brand);
      box-shadow: var(--shadow-convex-brand);
      transition: all var(--transition-normal);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: var(--space-2);
    }

    .cta-button:active {
      box-shadow: var(--shadow-pressed);
      background-color: var(--color-brand-deep);
    }

    .cta-button i {
      font-size: 20px;
      color: var(--color-canvas);
    }

    /* --- Floating Tab Bar (5+1) --- */
    .tab-bar {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 375px;
      padding: 0 var(--space-4);
      padding-bottom: var(--safe-area-bottom);
      z-index: 100;
    }

    .tab-bar-inner {
      background-color: var(--color-canvas);
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow-convex);
      display: flex;
      align-items: center;
      justify-content: space-around;
      height: var(--tab-bar-height);
      padding: 0 var(--space-2);
    }

    .tab-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      text-decoration: none;
      cursor: pointer;
      flex: 1;
      position: relative;
      padding: var(--space-2) 0;
    }

    .tab-item i {
      font-size: var(--tab-icon-size);
      color: var(--tab-inactive-color);
      transition: color var(--transition-normal);
    }

    .tab-item span {
      font-size: var(--tab-label-size);
      font-weight: var(--weight-medium);
      color: var(--tab-inactive-color);
      letter-spacing: var(--tracking-label);
      font-family: var(--font-cn-body);
      transition: color var(--transition-normal);
    }

    .tab-item.active i,
    .tab-item.active span {
      color: var(--tab-active-color);
    }

    /* Shutter button in center */
    .tab-item-shutter {
      position: relative;
      width: var(--shutter-size);
      height: var(--shutter-size);
      margin-top: -16px;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: var(--color-canvas);
      border-radius: var(--radius-shutter);
      box-shadow: var(--shadow-convex-brand);
      border: var(--shutter-border-width) solid var(--color-brand);
      cursor: pointer;
      transition: all var(--transition-normal);
    }

    .tab-item-shutter:active {
      box-shadow: var(--shadow-pressed);
    }

    .tab-item-shutter i {
      font-size: 22px;
      color: var(--color-brand);
    }
  </style>
</head>
<body>

  <!-- Top Navigation -->
  <div class="top-nav">
    <a href="templates.html" class="top-nav-back">
      <i class="ph ph-caret-left"></i>
    </a>
    <span class="top-nav-title">模板详情</span>
  </div>

  <!-- Large Preview Area -->
  <div class="preview-area">
    <div class="preview-placeholder">
      <i class="ph ph-portrait"></i>
      <span>柔光人像 · 预览</span>
    </div>
  </div>

  <!-- Template Name & Description -->
  <div class="info-section">
    <div class="template-name">柔光人像</div>
    <p class="template-desc">利用柔和的侧面光线勾勒面部轮廓，营造温润细腻的东方美学人像。适合室内窗边或清晨户外，呈现自然含蓄的光影过渡。</p>
  </div>

  <!-- Tags -->
  <div class="tags-area">
    <span class="tag-pill">人像</span>
    <span class="tag-pill">柔光</span>
    <span class="tag-pill">室内</span>
    <span class="tag-pill">自然光</span>
  </div>

  <!-- Camera Parameters Card -->
  <div class="info-card">
    <div class="info-card-title">相机参数</div>
    <div class="param-grid">
      <div class="param-item">
        <span class="param-label">曝光</span>
        <span class="param-value">+0.7 EV</span>
      </div>
      <div class="param-item">
        <span class="param-label">白平衡</span>
        <span class="param-value">5600K</span>
      </div>
      <div class="param-item">
        <span class="param-label">对焦模式</span>
        <span class="param-value">AF-S</span>
      </div>
    </div>

    <div class="param-divider"></div>

    <!-- Scene Suggestions -->
    <div class="info-card-title" style="margin-bottom: var(--space-4);">场景建议</div>
    <div class="suggestion-list">
      <div class="suggestion-item">
        <div class="suggestion-icon">
          <i class="ph ph-sun"></i>
        </div>
        <div class="suggestion-content">
          <div class="suggestion-label">光线方向</div>
          <div class="suggestion-text">侧面45度柔光，避免直射强光</div>
        </div>
      </div>
      <div class="suggestion-item">
        <div class="suggestion-icon">
          <i class="ph ph-ruler"></i>
        </div>
        <div class="suggestion-content">
          <div class="suggestion-label">拍摄距离</div>
          <div class="suggestion-text">建议 1.2 ~ 2.0 米，85mm 焦段最佳</div>
        </div>
      </div>
      <div class="suggestion-item">
        <div class="suggestion-icon">
          <i class="ph ph-image"></i>
        </div>
        <div class="suggestion-content">
          <div class="suggestion-label">背景建议</div>
          <div class="suggestion-text">选择简洁浅色背景，避免杂乱元素干扰</div>
        </div>
      </div>
    </div>
  </div>

  <!-- Fixed CTA Button -->
  <div class="cta-area">
    <button class="cta-button">
      <i class="ph ph-camera"></i>
      <span>套用此模板拍摄</span>
    </button>
  </div>

  <!-- Floating Tab Bar -->
  <nav class="tab-bar">
    <div class="tab-bar-inner">
      <!-- 首页 -->
      <a class="tab-item" href="home.html">
        <i class="ph ph-house"></i>
        <span>首页</span>
      </a>
      <!-- 模板库 (Active) -->
      <a class="tab-item active" href="templates.html">
        <i class="ph ph-squares-four"></i>
        <span>模板</span>
      </a>
      <!-- 快门 (Center) -->
      <a class="tab-item" href="capture.html">
        <div class="tab-item-shutter">
          <i class="ph ph-camera"></i>
        </div>
      </a>
      <!-- 作品集 -->
      <a class="tab-item" href="collections.html">
        <i class="ph ph-images"></i>
        <span>作品</span>
      </a>
      <!-- 我的 -->
      <a class="tab-item" href="profile.html">
        <i class="ph ph-user"></i>
        <span>我的</span>
      </a>
    </div>
  </nav>

</body>
</html>
