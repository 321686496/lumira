name: Admin Build Verification

# 实际部署由 Vercel 自动监听 GitHub push 触发。
# 此 workflow 仅做 build 验证，确保 monorepo 依赖变更不会破坏 admin 构建。
# Vercel 控制台配置：Import 项目时设置 Root Directory = lumira-server/packages/admin

on:
  push:
    branches: [master]
    paths:
      - 'lumira-server/packages/admin/**'
      - 'lumira-server/packages/shared/**'
  # 手动触发：在 GitHub Actions 页面点击 "Run workflow" 按钮即可
  # 用于在不依赖 push 的情况下验证 admin 构建（实际部署仍由 Vercel 处理）
  workflow_dispatch:
    inputs:
      reason:
        description: '触发原因（可选，仅用于日志记录）'
        required: false
        default: 'manual'
        type: string

jobs:
  verify:
    name: Verify Build
    runs-on: ubuntu-latest

    steps:
      - name: Print trigger info
        run: |
          echo "Trigger reason: ${{ github.event.inputs.reason || github.event_name }}"
          echo "Ref: ${{ github.ref }}"
          echo "Commit: ${{ github.sha }}"

      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: lumira-server/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: lumira-server
        run: pnpm install --frozen-lockfile

      - name: Build shared
        working-directory: lumira-server
        run: pnpm --filter @lumira/shared build

      - name: Build admin
        working-directory: lumira-server
        run: pnpm --filter @lumira/admin build
