name: Backend Deploy

# 部署模式：服务器直接构建
# GitHub Actions → SSH 登录服务器 → git pull → docker build → docker compose up -d
# 无需 Docker Hub 或任何容器镜像仓库依赖
#
# 触发条件：push 到 master 且修改了后端相关文件
# 服务器目录结构：见 deploy/docker-compose.prod.yml 注释

on:
  push:
    branches: [master]
    paths:
      - 'lumira-server/packages/backend/**'
      - 'lumira-server/packages/shared/**'
      - 'lumira-server/pnpm-lock.yaml'
      - 'lumira-server/pnpm-workspace.yaml'
      - 'lumira-server/package.json'
      - 'deploy/docker-compose.prod.yml'
      - '.github/workflows/backend-deploy.yml'
  # 手动触发：在 GitHub Actions 页面点击 "Run workflow" 按钮即可
  # 可选输入 reason 用于记录触发原因（仅展示用，不影响部署逻辑）
  workflow_dispatch:
    inputs:
      reason:
        description: '触发原因（可选，仅用于日志记录）'
        required: false
        default: 'manual'
        type: string

jobs:
  deploy:
    name: SSH Build & Deploy
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || '/opt/lumira/backend' }}
          GIT_REMOTE: ${{ secrets.GIT_REMOTE || 'origin' }}
          GIT_MIRROR_URL: ${{ secrets.GIT_MIRROR_URL || '' }}
          TRIGGER_REASON: ${{ github.event.inputs.reason || github.event_name }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          envs: DEPLOY_PATH,GIT_REMOTE,GIT_MIRROR_URL,TRIGGER_REASON
          # 国内服务器网络较慢，给足超时（60 分钟）
          command_timeout: 60m
          script: |
            set -e
            echo "==> 触发原因：$TRIGGER_REASON"

            # 检查部署目录是否已初始化
            if [ ! -d "$DEPLOY_PATH/repo/.git" ]; then
              echo "::error::部署目录 $DEPLOY_PATH/repo 未初始化"
              echo "::error::请先在服务器上执行以下命令完成初始化："
              echo "::error::  sudo mkdir -p $DEPLOY_PATH && sudo chown \$USER:\$USER $DEPLOY_PATH"
              echo "::error::  cd $DEPLOY_PATH"
              echo "::error::  git clone <仓库URL> repo"
              echo "::error::  cp repo/deploy/docker-compose.prod.yml ."
              echo "::error::  mkdir -p data"
              echo "::error::  cat > .env <<EOF"
              echo "::error::  JWT_SECRET=\$(openssl rand -hex 32)"
              echo "::error::  ADMIN_TOKEN=\$(openssl rand -hex 32)"
              echo "::error::  MYSQL_ROOT_PASSWORD=\$(openssl rand -hex 16)"
              echo "::error::  MYSQL_DATABASE=lumira"
              echo "::error::  MYSQL_USER=lumira"
              echo "::error::  MYSQL_PASSWORD=\$(openssl rand -hex 16)"
              echo "::error::  EOF"
              echo "::error::详细步骤见 .github/DEPLOY.md"
              exit 1
            fi

            echo "==> [1/5] 拉取最新代码"
            cd $DEPLOY_PATH/repo

            # 修复目录权限（确保当前用户有写权限）
            sudo chown -R $USER:$USER $DEPLOY_PATH/repo

            # 解决 Git "dubious ownership" 错误（目录所有者与当前用户不一致时）
            git config --global --add safe.directory $DEPLOY_PATH/repo

            # 国内服务器无法直接访问 GitHub 时，通过 GIT_MIRROR_URL 切换到 Gitee 镜像
            # 在 GitHub Actions Secrets 中设置 GIT_MIRROR_URL=git@gitee.com:xxx/lumira.git（SSH 格式）
            if [ -n "$GIT_MIRROR_URL" ]; then
              echo "==> 检测到 GIT_MIRROR_URL，切换到镜像源：$GIT_MIRROR_URL"
              git remote set-url $GIT_REMOTE "$GIT_MIRROR_URL"
            fi

            # GitHub 偶发 "Empty reply from server"（HTTP/2 连接被中间网络重置），强制 HTTP/1.1 并重试
            git config http.version HTTP/1.1
            for attempt in 1 2 3 4 5; do
              if git fetch --all; then
                break
              fi
              echo "==> git fetch 失败（第 $attempt 次），5 秒后重试..."
              sleep 5
            done
            git reset --hard $GIT_REMOTE/master
            echo "当前代码版本："
            git log --oneline -1

            echo "==> [2/5] 同步部署用 docker-compose 文件"
            cp deploy/docker-compose.prod.yml $DEPLOY_PATH/docker-compose.prod.yml

            echo "==> [3/5] 确保数据目录存在"
            mkdir -p $DEPLOY_PATH/data
            mkdir -p $DEPLOY_PATH/data/mysql

            echo "==> [4/5] 构建后端镜像（git reset 已确保代码最新，Docker 会自动失效受影响的缓存层）"
            cd $DEPLOY_PATH
            docker compose -f docker-compose.prod.yml --env-file .env build

            echo "==> [5/5] 重启容器（--force-recreate 强制重建容器，确保新镜像生效）"
            docker compose -f docker-compose.prod.yml --env-file .env up -d --force-recreate
            docker image prune -f

            echo "==> 部署完成，等待 15 秒后查看日志："
            sleep 15
            docker compose -f docker-compose.prod.yml logs --tail=30
