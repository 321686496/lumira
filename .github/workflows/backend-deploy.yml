name: Backend Deploy

on:
  push:
    branches: [master]
    paths:
      - 'lumira-server/packages/backend/**'
      - 'lumira-server/packages/shared/**'

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKER_IMAGE }}
          tags: |
            type=sha
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: lumira-server
          file: lumira-server/packages/backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ secrets.DOCKER_IMAGE }}:latest
          cache-to: type=inline

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        env:
          DOCKER_IMAGE: ${{ secrets.DOCKER_IMAGE }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || '/opt/lumira/backend' }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          envs: DOCKER_IMAGE,DEPLOY_PATH
          script: |
            docker pull $DOCKER_IMAGE:latest
            cd $DEPLOY_PATH
            docker compose down
            docker compose up -d
            docker image prune -f
