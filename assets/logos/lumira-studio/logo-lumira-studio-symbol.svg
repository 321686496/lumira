<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Three overlapping frames -->
  <rect x="65" y="65" width="70" height="70" rx="14" fill="none" stroke="#E8845C" stroke-width="2" opacity="0.85"/>

  <g transform="rotate(15, 100, 100)" opacity="0.85">
    <rect x="65" y="65" width="70" height="70" rx="14" fill="none" stroke="#E8845C" stroke-width="2"/>
  </g>

  <g transform="rotate(-15, 100, 100)" opacity="0.85">
    <rect x="65" y="65" width="70" height="70" rx="14" fill="none" stroke="#E8845C" stroke-width="2"/>
  </g>

  <!-- Center light core: four-pointed star -->
  <path d="M 100 68 L 104 94 L 130 94 L 106 108 L 116 134 L 100 116 L 84 134 L 94 108 L 70 94 L 96 94 Z" fill="#E8845C" fill-opacity="0.95"/>
</svg>
