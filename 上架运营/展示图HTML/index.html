<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">

<title>如画 Lumira · App Store 展示图（8 张 · 1080×1920）</title>
<style>
  :root{
    --cream:#FAF7F2;
    --cream-deep:#F2EEE6;
    --ink:#1A1A1A;
    --ink-2:#5C5852;
    --ink-3:#9C9690;
    --gold:#C9A96E;
    --gold-deep:#A88550;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:#EAE6DE;font-family:-apple-system,"PingFang SC","Microsoft YaHei","Helvetica Neue",Helvetica,Arial,sans-serif;}

  /* 顶部工具栏 */
  .toolbar{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:14px;flex-wrap:wrap;
    padding:12px 22px;background:rgba(250,247,242,.94);backdrop-filter:blur(8px);border-bottom:1px solid #DCD7CB;}
  .toolbar h1{font-size:17px;font-weight:700;color:var(--ink);margin-right:4px;}
  .toolbar .sub{font-size:12px;color:var(--ink-2);}
  .toolbar .spacer{flex:1;}
  .toolbar label{font-size:12px;color:var(--ink-2);display:flex;align-items:center;gap:6px;}
  .toolbar input[type=range]{width:120px;}
  .toolbar button{font-size:12px;padding:6px 12px;border-radius:16px;border:1px solid #D0C9B7;background:#fff;color:var(--ink);cursor:pointer;}
  .toolbar button:hover{border-color:var(--gold);color:var(--gold-deep);}

  /* 画廊：每行四张 */
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;padding:24px;max-width:1500px;margin:0 auto;}
  .post{background:#FBF9F4;border-radius:14px;overflow:hidden;box-shadow:0 10px 26px rgba(60,52,40,.14);
    border:1px solid #ECE5D6;}
  .post .cap{display:flex;align-items:center;justify-content:space-between;padding:9px 12px;font-size:12px;color:var(--ink-2);}
  .post .cap b{color:var(--ink);font-size:12px;}
  .cell{position:relative;width:100%;aspect-ratio:9/16;overflow:hidden;background:#E4DED2;border-top:1px solid #EAE2D2;}

  /* 画板（1080 x 1920） */
  .artboard{position:absolute;top:0;left:0;width:1080px;height:1920px;background:var(--cream);transform-origin:top left;}
  .artboard .label{position:absolute;top:52px;right:44px;font-size:18px;font-weight:600;color:rgba(90,80,60,.45);letter-spacing:2px;}

  /* 文字 */
  .big-title{font-size:66px;font-weight:800;line-height:1.2;color:var(--ink);letter-spacing:1px;}
  .big-title .hl{color:var(--gold-deep);}
  .sub-title{font-size:31px;font-weight:500;color:var(--ink-2);margin-top:18px;letter-spacing:.5px;}

  /* 手机壳（屏幕比例按真实手机 9:19.5） */
  .phone{background:#1E1C1A;border-radius:44px;padding:12px;box-shadow:0 34px 70px rgba(40,34,26,.45);flex:none;position:relative;}
  .phone .screen{background:var(--cream);border-radius:34px;overflow:hidden;position:relative;}
  .phone .notch{position:absolute;top:8px;left:50%;transform:translateX(-50%);width:132px;height:22px;background:#1E1C1A;border-radius:16px;z-index:3;}

  .pic{background-size:cover;background-position:center;background-color:#E4DED2;}
  .pill{display:inline-flex;align-items:center;gap:10px;background:var(--ink);color:#fff;border-radius:999px;padding:20px 38px;font-size:32px;font-weight:600;}
  .badge-gold{background:linear-gradient(135deg,#D8B57A,#B8894E);color:#fff;}
  /* 手机内模板列表行 */
  .pt{display:flex;gap:14px;align-items:center;background:#fff;border-radius:16px;padding:12px;border:1px solid #F0E8D8;box-shadow:0 10px 22px rgba(90,78,58,.08);}
  .pt.hot{border:1px solid #E7CB9A;background:linear-gradient(180deg,#FFFDF6,#FBF3E2);}
  .pt .th{width:84px;height:84px;border-radius:12px;background-size:cover;background-position:center;background-color:#E9E2D2;flex:none;}
  .pt .nm{font-size:16px;font-weight:700;color:var(--ink);line-height:1.25;}
  .pt .tg{font-size:12px;color:var(--ink-2);margin-top:3px;}
  .pt .ic{width:26px;height:26px;border-radius:8px;background:var(--gold);display:grid;place-items:center;font-size:14px;color:#fff;flex:none;margin-left:auto;}
</style>

<script>
  var grid = document.getElementById('grid');
  var cells = Array.prototype.slice.call(grid.querySelectorAll('.cell'));
  var scaleRange = document.getElementById('scaleRange');
  var baseScale = 1; // 记录用户设定的缩放倍率

  function proto(s){ setAllScale(s); }
  function setAllScale(s){
    baseScale = s;
    scaleRange.value = s;
    cells.forEach(function(c){
      var art = c.querySelector('.artboard');
      var sBase = c.clientWidth / 1080;      // 适配到单元格宽度
      var sc = sBase * baseScale;
      art.style.transform = 'scale(' + sc + ')';
    });
  }
  scaleRange.addEventListener('input', function(){ setAllScale(parseFloat(scaleRange.value)); });
  window.addEventListener('resize', function(){ setAllScale(baseScale); });

  setAllScale(1);
</script>
